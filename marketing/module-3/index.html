<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketing Module 3 | Know Your Customer</title><style>html,body{margin:0;height:100%;background:#f8f4ec}iframe{width:100%;height:100vh;border:0;display:block}</style></head><body><iframe id="module" src="/marketing/unit-3/" title="Marketing Module 3"></iframe><script>const f=document.getElementById('module');f.addEventListener('load',()=>{try{const d=f.contentDocument;d.title='Marketing Module 3 | Know Your Customer';const lessons=[...d.querySelectorAll('.lesson')];const seg=lessons.find(x=>x.textContent.includes('Segmentation divides a broad market'));if(seg){seg.innerHTML='<strong>Segmentation</strong> divides a broad market into smaller groups with shared traits or behaviors.<br><br><strong>Psychographic segmentation</strong> groups people by lifestyle, interests, values, personality, attitudes, or hobbies. Think: <em>why they like what they like.</em><br><br><strong>Behavioral segmentation</strong> groups people by actions such as what they buy, how often they buy, brand loyalty, clicks, coupon use, or how they use a product. Think: <em>what they actually do.</em><br><br><strong>Demographic</strong> uses traits such as age, income, education, or family status. <strong>Geographic</strong> uses location.';}const footer=[...d.querySelectorAll('.footer')][0];if(footer) footer.textContent='MR. D • Marketing Fundamentals • Module 3';}catch(e){console.warn(e)}});</script></body></html>
