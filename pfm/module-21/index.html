<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PFM Module 21 | Credit Scores Explained</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><style>:root{

*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:var(--ink);font:14px/1.7 Poppins,sans-serif}.layout{display:grid;grid-template-columns:290px minmax(0,1fr);max-width:1500px;min-height:100vh;margin:auto}.sidebar{background:#0c1a2e;color:#e2e8f0;padding:28px 20px;position:sticky;top:0;height:100vh}.sidebar a{color:#7dd3fc}.sb-logo{font-size:17px;font-weight:700}.sb-sub{font:11px 'JetBrains Mono',monospace;color:#94a3b8}.sb-box{background:#ffffff0d;border-radius:9px;padding:17px;margin:24px 0}.sb-score{font:24px 'JetBrains Mono',monospace}.sb-item{padding:11px 8px;border-radius:8px;color:#94a3b8;font-size:12px}.sb-item.active{background:#0ea5e925;color:#7dd3fc}.sb-item.done{color:#86c6b6}.sb-item.locked{opacity:.5}.main{padding:30px 42px 65px;min-width:0}.hero{background:#0c1a2e;border-radius:14px;padding:35px 40px;margin-bottom:24px;color:white}.hero h1{color:white;font-size:35px;margin:7px 0}.hero p{color:#a6acc0}.card{background:white;border:1px solid var(--border);border-radius:14px;padding:32px;margin:0 0 20px}.eyebrow{font:11px 'JetBrains Mono',monospace;color:#0369a1;letter-spacing:.7px;text-transform:uppercase}h1{font-size:27px;line-height:1.25;color:var(--ink)}h2{font-size:17px;color:var(--ink)}.muted{font-size:12px;color:var(--ink3)}.bar{height:5px;background:var(--surface3);border-radius:5px;overflow:hidden;margin:16px 0}.bar span{display:block;height:100%;background:var(--sky)}.lesson{padding:22px;background:linear-gradient(90deg,var(--sky-bg),white);border-left:4px solid var(--sky);border-radius:9px;color:var(--ink2);line-height:1.85;margin:20px 0}.choice{display:block;width:100%;text-align:left;background:white;border:1.5px solid #d9d7e2;border-radius:9px;padding:14px 18px;margin:9px 0;font:14px Poppins,sans-serif;color:var(--ink);cursor:pointer}.choice:hover:not(:disabled){border-color:var(--sky);background:var(--sky-bg)}.choice:disabled{opacity:.65}.btn{background:var(--sky);color:white;border:0;border-radius:9px;padding:12px 20px;font:600 13px Poppins,sans-serif;cursor:pointer;margin:16px 8px 4px 0}.btn:disabled{opacity:.4}.good,.bad{padding:15px;border-left:3px solid;border-radius:9px;margin:15px 0}.good{background:var(--green-bg);border-color:var(--green)}.bad{background:var(--amber-bg);border-color:var(--amber)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fields label{font-size:12px;font-weight:600}input,select{display:block;width:100%;padding:12px;margin-top:6px;border:1px solid #d9d7e2;border-radius:9px;font:14px Poppins,sans-serif}.factors{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:20px 0}.factor{background:var(--sky-bg);border-radius:9px;padding:13px 7px;text-align:center;font-size:11px}.factor b{display:block;font:600 23px 'JetBrains Mono',monospace;color:var(--sky-dark)}.cert{border:2px solid var(--sky);padding:35px;text-align:center;border-radius:10px;margin:22px 0}.cert h2{font-size:25px}.cert strong{font-size:30px;color:var(--sky-dark)}@media(max-width:800px){.layout{display:block}.sidebar{height:auto;position:relative}.sb-nav{display:none}.main{padding:18px}.hero{padding:24px}.card{padding:22px}}@media(max-width:550px){.fields{grid-template-columns:1fr}.factors{grid-template-columns:repeat(2,1fr)}}@media print{.sidebar,.hero,.btn{display:none!important}.layout{display:block}.main{padding:0}}</style></head><body><div class="layout"><aside class="sidebar"><div class="sb-logo">MR. D'S HQ</div><div class="sb-sub">PERSONAL FINANCIAL MANAGEMENT</div><p><a href="/pfm/">← Back to PFM</a></p><div class="sb-box"><div class="sb-sub">MODULE PROGRESS</div><div id="sbScore" class="sb-score">0 / 12</div><div id="sbStatus" class="sb-sub">Ready to begin</div></div><div class="sb-nav"><div class="sb-sub">LEARNING PATH</div><div id="sbLessons"></div></div></aside><main class="main"><div class="hero"><div class="eyebrow">PFM MODULE 21 · INTERACTIVE COURSE</div><h1>Credit Scores Explained</h1><p>Understand the factors, credit bureaus, and decisions that shape your financial future.</p></div><div id="app"></div></main></div><script>
const lessons=[["Credit score fundamentals","A credit score estimates how likely a borrower is to repay as agreed. Many FICO scores range from 300 to 850. A score is not your income, bank balance, or a guarantee of approval.",[["Which is the most accurate description of a credit score?",["A measure of repayment risk based on credit information","The amount of money in a checking account","A government-issued borrowing limit"],0],["Which is a common FICO score range?",["0–100","300–850","500–1000"],1]]],["Credit bureaus vs. credit unions","Equifax, Experian, and TransUnion are the three nationwide consumer credit bureaus. They collect credit-report information. A credit union is a financial institution, not a credit bureau. Bureaus do not themselves set one universal score.",[["Which group contains the three nationwide credit bureaus?",["Visa, Mastercard, Discover","Equifax, Experian, TransUnion","Chase, Wells Fargo, Capital One"],1],["A credit union is best described as…",["A member-owned financial institution","One of the three national credit bureaus","A type of FICO scoring formula"],0]]],["Five FICO factors","Typical FICO weighting: payment history 35%, amounts owed 30%, length of credit history 15%, new credit 10%, credit mix 10%. These are general category weights, not a fixed formula for every person. Amounts owed includes more than utilization.",[["Which factor usually carries the greatest weight?",["Credit mix","Payment history","New credit"],1],["Which pair together accounts for about 65% of typical FICO weighting?",["Payment history and amounts owed","Credit mix and new credit","Length of history and credit mix"],0]]],["Utilization lab","Credit utilization is revolving credit balances divided by revolving credit limits. Example: $450 owed on a $1,500 limit is 30%. Lower utilization generally helps, but 30% is not a magic cutoff. Paying in full and on time avoids unnecessary interest.",[["A $200 balance on a $1,000 limit is what utilization?",["2%","20%","50%"],1],["A student owes $900 on a $1,500 card. Which action generally lowers utilization?",["Paying down the balance","Making several new applications","Missing the payment"],0]]],["Real-world consequences","Lenders may use credit reports, scores, income, and debt when making decisions. A stronger credit profile can help qualify for better terms, but rates also depend on the lender, market, and borrower. Checking your own report is a soft inquiry; applying for credit can trigger a hard inquiry.",[["Which activity generally does not hurt your credit score?",["Checking your own credit report","Missing a payment","Applying for several loans in a short period"],0],["Why can a higher interest rate matter?",["It can increase total borrowing cost","It always lowers the monthly payment","It changes a debit card into a credit card"],0]]],["Build, check and protect","Build credit by paying on time, keeping balances manageable, and limiting unnecessary applications. Reports can be requested at AnnualCreditReport.com. A credit freeze is free and restricts access to your report for many new-credit applications; it does not erase debt or prevent every kind of fraud. Dispute errors with the bureau and furnisher.",[["Where is the federally authorized website to request free credit reports?",["AnnualCreditReport.com","CreditUnionScores.com","FICO.gov"],0],["What does a credit freeze primarily do?",["Block many new-credit checks until lifted","Erase all past late payments","Guarantee identity theft cannot occur"],0]]]],endpoint='https://script.google.com/macros/s/AKfycbyucfQcDDR9S_4i8_EiI2LAm0k49NNGT0IBiRnXTjZQKgtfuOwM73Wtxxt5fzojGFY/exec';let state={step:-1,q:0,answers:[],tries:0,first:'',last:'',block:'',started:Date.now(),submitted:false};const app=document.getElementById('app');function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function render(){let total=lessons.length*2,done=state.answers.length;document.getElementById('sbScore').textContent=done+' / '+total;document.getElementById('sbStatus').textContent=state.step<0?'Ready to begin':state.step>=lessons.length?'Completed':'Lesson '+(state.step+1)+' of '+lessons.length;document.getElementById('sbLessons').innerHTML=lessons.map((l,i)=>'<div class="sb-item '+(i<state.step?'done':i===state.step?'active':'locked')+'">'+(i<state.step?'✓ ':i+1+'. ')+esc(l[0])+'</div>').join('');if(state.step<0){app.innerHTML='<div class="card"><div class="eyebrow">Personal Finance · Interactive Learning</div><h1>Credit Scores Explained</h1><p>Understand your credit score, the three credit bureaus, the five scoring factors, utilization, borrowing costs and protecting your identity.</p><p class="muted">Six guided lessons · 12 scored checkpoints · two attempts per question · certificate · Google Sheets submission</p><div class="fields"><label>First name<input id="first" autocomplete="given-name"></label><label>Last name<input id="last" autocomplete="family-name"></label><label>Class period / block<select id="block"><option value="">Choose</option><option>1</option><option>2</option><option>3</option><option>4</option><option>A</option><option>B</option></select></label></div><button class="btn" onclick="start()">Begin Module 21 →</button></div>';return}if(state.step>=lessons.length){let score=state.answers.reduce((a,x)=>a+x.points,0),pct=Math.round(score/total*100);app.innerHTML='<div class="card"><div class="eyebrow">Module completed</div><h1>'+pct+'% · '+score+'/'+total+'</h1><div class="cert"><div class="eyebrow">Mr. D · Personal Financial Management</div><h2>Certificate of Completion</h2><p>Awarded to</p><h2>'+esc(state.first+' '+state.last)+'</h2><p>Credit Scores Explained · Module 21</p><strong>'+pct+'%</strong><p>Completion ID: '+esc(state.session)+'</p></div><p id="status" class="muted">'+esc(state.status||'Ready to submit to Google Sheets.')+'</p><button class="btn" onclick="submit()">Submit / Retry Google Sheets</button> <button class="btn" onclick="window.print()">Print certificate</button></div>';return}let l=lessons[state.step],q=l[2][state.q],record=state.answers[done-1],active=state.active,feedback=active?'<div class="'+(active.correct?'good':'bad')+'">'+(active.correct?'Correct.':active.locked?'Review the correct answer: '+esc(q[1][q[2]]):'Try again. Re-read the lesson and choose another answer.')+'</div>':'';app.innerHTML='<div class="card"><div class="eyebrow">Lesson '+(state.step+1)+' of '+lessons.length+' · Checkpoint '+(state.q+1)+' of 2</div><div class="bar"><span style="width:'+Math.round(done/total*100)+'%"></span></div><h1>'+esc(l[0])+'</h1><div class="lesson">'+esc(l[1])+'</div>'+(state.step===2?'<div class="factors"><div class="factor"><b>35%</b>Payment history</div><div class="factor"><b>30%</b>Amounts owed</div><div class="factor"><b>15%</b>History length</div><div class="factor"><b>10%</b>New credit</div><div class="factor"><b>10%</b>Credit mix</div></div>':'')+'<h2>'+esc(q[0])+'</h2>'+q[1].map((v,i)=>'<button class="choice" '+(active?.locked?'disabled':'')+' onclick="answer('+i+')">'+String.fromCharCode(65+i)+'. '+esc(v)+'</button>').join('')+feedback+'<button class="btn" '+(!active?.locked?'disabled':'')+' onclick="next()">Continue →</button><p class="muted">Question '+(done+1)+' of '+total+'. Two attempts maximum.</p></div>'}window.start=()=>{let f=document.getElementById('first').value.trim(),l=document.getElementById('last').value.trim(),b=document.getElementById('block').value;if(!f||!l||!b){alert('Enter your name and class period.');return}Object.assign(state,{first:f,last:l,block:b,step:0,session:'PFM22-'+Date.now().toString(36)});render()};window.answer=i=>{if(state.active?.locked)return;let q=lessons[state.step][2][state.q],tries=(state.active?.tries||0)+1,correct=i===q[2],locked=correct||tries>=2;state.active={tries,correct,locked,selected:i};if(locked)state.answers.push({lesson:state.step+1,question:state.q+1,selected:i,correct,points:correct?(tries===1?1:.5):0});render()};window.next=()=>{if(!state.active?.locked)return;state.active=null;if(state.q===0)state.q=1;else{state.q=0;state.step++}render();if(state.step>=lessons.length)submit()};window.submit=async()=>{if(state.submitted)return;let score=state.answers.reduce((a,x)=>a+x.points,0),mins=Math.max(1,Math.round((Date.now()-state.started)/60000)),name=state.first+' '+state.last,record={moduleId:'pfm-module-21-credit-scores',moduleTitle:'Personal Finance Module 21 - Credit Scores Explained',category:'Personal Finance',topic:'Credit Scores and Credit Reports',productType:'Interactive Module',moduleSize:'standard',score,totalQuestions:12,percent:Math.round(score/12*100)+'%',completed:'Yes',answers:JSON.stringify(state.answers),timeMinutes:mins,sessionId:state.session,studentName:name,firstName:state.first,lastName:state.last,classPeriod:state.block,version:'1.0-pfm-m21'};state.status='Submitting…';render();let body=new URLSearchParams({action:'moduleSubmit',manualEntry:'1',moduleNumber:'21',bellId:'PFM-MODULE-21-CREDIT-SCORES',label:record.moduleTitle,firstName:state.first,lastName:state.last,name,answer:JSON.stringify(record),late:'0',duration:String(mins),timestamp:new Date().toISOString(),cls:'Personal Finance',googleName:'Manual entry',schoolEmail:'',block:state.block});try{let res=await fetch(endpoint,{method:'POST',body}),data=await res.json();if(!data.success&&data.error!=='This completion was already submitted.')throw Error(data.error||'Unconfirmed');state.submitted=true;state.status='Google Sheets confirmed your submission.'}catch(e){state.status='Submission not confirmed. Retry while connected or show your certificate to Mr. D.';console.error(e)}render()};render();
</script></body></html>
