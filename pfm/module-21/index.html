<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PFM Module 21 | Credit Scores Explained</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--ink:#172033;--teal:#18776f;--blue:#2f6fb5;--cream:#f6f1e8}*{box-sizing:border-box}body{margin:0;background:var(--cream);font:15px/1.65 Poppins,Arial;color:var(--ink)}main{max-width:900px;margin:auto;padding:24px 18px 70px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}a{color:var(--blue)}.card{background:#fffdf8;border:1px solid #dedbd4;border-radius:22px;padding:clamp(20px,4vw,38px);margin:18px 0;box-shadow:0 10px 30px #332b1b0a}.eyebrow{font-size:12px;font-weight:800;color:var(--teal);letter-spacing:.09em;text-transform:uppercase}h1{font-size:clamp(27px,5vw,43px);line-height:1.16}h2{font-size:24px;line-height:1.3}.muted{color:#616b75}.bar{height:9px;background:#e4e9eb;border-radius:12px;overflow:hidden}.bar span{display:block;height:100%;background:var(--teal);transition:.2s}.choice{display:block;width:100%;text-align:left;border:1px solid #cfd6db;background:white;padding:13px 16px;border-radius:12px;margin:9px 0;font:inherit;cursor:pointer}.choice:hover{border-color:var(--blue)}.choice:disabled{opacity:.7;cursor:default}.good{background:#eaf7ee;padding:14px;border-radius:12px}.bad{background:#fff3e5;padding:14px;border-radius:12px}.btn{border:0;border-radius:12px;background:var(--blue);color:white;padding:13px 20px;font:700 14px Poppins;cursor:pointer;margin-top:15px}.btn:disabled{opacity:.4}.factors{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:18px 0}.factor{padding:12px 6px;border-radius:12px;background:#e9f3f1;text-align:center;font-size:11px}.factor b{display:block;font-size:23px}.lesson{padding:17px;background:#edf4f6;border-left:4px solid var(--teal);border-radius:8px}.cert{text-align:center;border:3px double #c5a46a;padding:30px;margin:20px 0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,select{width:100%;padding:12px;border:1px solid #cdd2d8;border-radius:9px;font:inherit}@media(max-width:600px){.factors{grid-template-columns:repeat(2,1fr)}.fields{grid-template-columns:1fr}}@media print{header,.btn,.bar{display:none!important}body{background:white}}</style></head><body><main><header><a href="/pfm/">← Personal Finance</a><strong>MR. D'S HQ · MODULE 22</strong></header><div id="app"></div></main><script>
const lessons=[["Credit score fundamentals","A credit score estimates how likely a borrower is to repay as agreed. Many FICO scores range from 300 to 850. A score is not your income, bank balance, or a guarantee of approval.",[["Which is the most accurate description of a credit score?",["A measure of repayment risk based on credit information","The amount of money in a checking account","A government-issued borrowing limit"],0],["Which is a common FICO score range?",["0–100","300–850","500–1000"],1]]],["Credit bureaus vs. credit unions","Equifax, Experian, and TransUnion are the three nationwide consumer credit bureaus. They collect credit-report information. A credit union is a financial institution, not a credit bureau. Bureaus do not themselves set one universal score.",[["Which group contains the three nationwide credit bureaus?",["Visa, Mastercard, Discover","Equifax, Experian, TransUnion","Chase, Wells Fargo, Capital One"],1],["A credit union is best described as…",["A member-owned financial institution","One of the three national credit bureaus","A type of FICO scoring formula"],0]]],["Five FICO factors","Typical FICO weighting: payment history 35%, amounts owed 30%, length of credit history 15%, new credit 10%, credit mix 10%. These are general category weights, not a fixed formula for every person. Amounts owed includes more than utilization.",[["Which factor usually carries the greatest weight?",["Credit mix","Payment history","New credit"],1],["Which pair together accounts for about 65% of typical FICO weighting?",["Payment history and amounts owed","Credit mix and new credit","Length of history and credit mix"],0]]],["Utilization lab","Credit utilization is revolving credit balances divided by revolving credit limits. Example: $450 owed on a $1,500 limit is 30%. Lower utilization generally helps, but 30% is not a magic cutoff. Paying in full and on time avoids unnecessary interest.",[["A $200 balance on a $1,000 limit is what utilization?",["2%","20%","50%"],1],["A student owes $900 on a $1,500 card. Which action generally lowers utilization?",["Paying down the balance","Making several new applications","Missing the payment"],0]]],["Real-world consequences","Lenders may use credit reports, scores, income, and debt when making decisions. A stronger credit profile can help qualify for better terms, but rates also depend on the lender, market, and borrower. Checking your own report is a soft inquiry; applying for credit can trigger a hard inquiry.",[["Which activity generally does not hurt your credit score?",["Checking your own credit report","Missing a payment","Applying for several loans in a short period"],0],["Why can a higher interest rate matter?",["It can increase total borrowing cost","It always lowers the monthly payment","It changes a debit card into a credit card"],0]]],["Build, check and protect","Build credit by paying on time, keeping balances manageable, and limiting unnecessary applications. Reports can be requested at AnnualCreditReport.com. A credit freeze is free and restricts access to your report for many new-credit applications; it does not erase debt or prevent every kind of fraud. Dispute errors with the bureau and furnisher.",[["Where is the federally authorized website to request free credit reports?",["AnnualCreditReport.com","CreditUnionScores.com","FICO.gov"],0],["What does a credit freeze primarily do?",["Block many new-credit checks until lifted","Erase all past late payments","Guarantee identity theft cannot occur"],0]]]],endpoint='https://script.google.com/macros/s/AKfycbyucfQcDDR9S_4i8_EiI2LAm0k49NNGT0IBiRnXTjZQKgtfuOwM73Wtxxt5fzojGFY/exec';let state={step:-1,q:0,answers:[],tries:0,first:'',last:'',block:'',started:Date.now(),submitted:false};const app=document.getElementById('app');function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function render(){let total=lessons.length*2,done=state.answers.length;if(state.step<0){app.innerHTML='<div class="card"><div class="eyebrow">Personal Finance · Interactive Learning</div><h1>Credit Scores Explained</h1><p>Understand your credit score, the three credit bureaus, the five scoring factors, utilization, borrowing costs and protecting your identity.</p><p class="muted">Six guided lessons · 12 scored checkpoints · two attempts per question · certificate · Google Sheets submission</p><div class="fields"><label>First name<input id="first" autocomplete="given-name"></label><label>Last name<input id="last" autocomplete="family-name"></label><label>Class period / block<select id="block"><option value="">Choose</option><option>1</option><option>2</option><option>3</option><option>4</option><option>A</option><option>B</option></select></label></div><button class="btn" onclick="start()">Begin Module 21 →</button></div>';return}if(state.step>=lessons.length){let score=state.answers.reduce((a,x)=>a+x.points,0),pct=Math.round(score/total*100);app.innerHTML='<div class="card"><div class="eyebrow">Module completed</div><h1>'+pct+'% · '+score+'/'+total+'</h1><div class="cert"><div class="eyebrow">Mr. D · Personal Financial Management</div><h2>Certificate of Completion</h2><p>Awarded to</p><h2>'+esc(state.first+' '+state.last)+'</h2><p>Credit Scores Explained · Module 21</p><strong>'+pct+'%</strong><p>Completion ID: '+esc(state.session)+'</p></div><p id="status" class="muted">'+esc(state.status||'Ready to submit to Google Sheets.')+'</p><button class="btn" onclick="submit()">Submit / Retry Google Sheets</button> <button class="btn" onclick="window.print()">Print certificate</button></div>';return}let l=lessons[state.step],q=l[2][state.q],record=state.answers[done-1],active=state.active,feedback=active?'<div class="'+(active.correct?'good':'bad')+'">'+(active.correct?'Correct.':active.locked?'Review the correct answer: '+esc(q[1][q[2]]):'Try again. Re-read the lesson and choose another answer.')+'</div>':'';app.innerHTML='<div class="card"><div class="eyebrow">Lesson '+(state.step+1)+' of '+lessons.length+' · Checkpoint '+(state.q+1)+' of 2</div><div class="bar"><span style="width:'+Math.round(done/total*100)+'%"></span></div><h1>'+esc(l[0])+'</h1><div class="lesson">'+esc(l[1])+'</div>'+(state.step===2?'<div class="factors"><div class="factor"><b>35%</b>Payment history</div><div class="factor"><b>30%</b>Amounts owed</div><div class="factor"><b>15%</b>History length</div><div class="factor"><b>10%</b>New credit</div><div class="factor"><b>10%</b>Credit mix</div></div>':'')+'<h2>'+esc(q[0])+'</h2>'+q[1].map((v,i)=>'<button class="choice" '+(active?.locked?'disabled':'')+' onclick="answer('+i+')">'+String.fromCharCode(65+i)+'. '+esc(v)+'</button>').join('')+feedback+'<button class="btn" '+(!active?.locked?'disabled':'')+' onclick="next()">Continue →</button><p class="muted">Question '+(done+1)+' of '+total+'. Two attempts maximum.</p></div>'}window.start=()=>{let f=document.getElementById('first').value.trim(),l=document.getElementById('last').value.trim(),b=document.getElementById('block').value;if(!f||!l||!b){alert('Enter your name and class period.');return}Object.assign(state,{first:f,last:l,block:b,step:0,session:'PFM22-'+Date.now().toString(36)});render()};window.answer=i=>{if(state.active?.locked)return;let q=lessons[state.step][2][state.q],tries=(state.active?.tries||0)+1,correct=i===q[2],locked=correct||tries>=2;state.active={tries,correct,locked,selected:i};if(locked)state.answers.push({lesson:state.step+1,question:state.q+1,selected:i,correct,points:correct?(tries===1?1:.5):0});render()};window.next=()=>{if(!state.active?.locked)return;state.active=null;if(state.q===0)state.q=1;else{state.q=0;state.step++}render();if(state.step>=lessons.length)submit()};window.submit=async()=>{if(state.submitted)return;let score=state.answers.reduce((a,x)=>a+x.points,0),mins=Math.max(1,Math.round((Date.now()-state.started)/60000)),name=state.first+' '+state.last,record={moduleId:'pfm-module-21-credit-scores',moduleTitle:'Personal Finance Module 21 - Credit Scores Explained',category:'Personal Finance',topic:'Credit Scores and Credit Reports',productType:'Interactive Module',moduleSize:'standard',score,totalQuestions:12,percent:Math.round(score/12*100)+'%',completed:'Yes',answers:JSON.stringify(state.answers),timeMinutes:mins,sessionId:state.session,studentName:name,firstName:state.first,lastName:state.last,classPeriod:state.block,version:'1.0-pfm-m21'};state.status='Submitting…';render();let body=new URLSearchParams({action:'moduleSubmit',manualEntry:'1',moduleNumber:'21',bellId:'PFM-MODULE-21-CREDIT-SCORES',label:record.moduleTitle,firstName:state.first,lastName:state.last,name,answer:JSON.stringify(record),late:'0',duration:String(mins),timestamp:new Date().toISOString(),cls:'Personal Finance',googleName:'Manual entry',schoolEmail:'',block:state.block});try{let res=await fetch(endpoint,{method:'POST',body}),data=await res.json();if(!data.success&&data.error!=='This completion was already submitted.')throw Error(data.error||'Unconfirmed');state.submitted=true;state.status='Google Sheets confirmed your submission.'}catch(e){state.status='Submission not confirmed. Retry while connected or show your certificate to Mr. D.';console.error(e)}render()};render();
</script></body></html>
