<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PFM Module 21 | Credit Scores Explained</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><style>:root{--navy:#102235;--blue:#2f6fb5;--cream:#f7f1e7;--ink:#172033;--muted:#667085;--line:#d8e0e7;--green:#18776f}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,var(--cream),#eef5f8 55%,#f8fafc);font-family:Poppins,Arial,sans-serif;color:var(--ink);line-height:1.58}header{background:var(--navy);color:white;padding:16px max(18px,calc((100vw - 1160px)/2));display:flex;justify-content:space-between;align-items:center;gap:16px}header b{font-size:18px}header a{color:#d9eafa;text-decoration:none;font-size:13px}.shell{width:min(1080px,92%);margin:24px auto 70px}.hero{background:linear-gradient(135deg,#102235,#173d58 68%,#1b6e73);color:white;border-radius:30px;padding:30px;box-shadow:0 18px 42px rgba(15,23,42,.13);margin-bottom:20px}.hero h1{font-size:clamp(2rem,4.7vw,3.7rem);letter-spacing:-.055em;line-height:1.04;margin:10px 0 14px;color:white}.hero p{color:#dce8ef;line-height:1.7}.eyebrow{font-size:.76rem;font-weight:900;letter-spacing:.14em;color:#b9ece7;text-transform:uppercase}.panel{background:white;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 10px 28px rgba(15,23,42,.06);margin-bottom:18px}h1{font-size:clamp(24px,3vw,32px);line-height:1.2}h2{font-size:21px}.muted{color:var(--muted);font-size:13px;line-height:1.65}.progressrow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#c6f0ec;font-weight:800;font-size:.86rem;margin-top:20px}.progress{height:9px;background:rgba(255,255,255,.16);border-radius:999px;overflow:hidden;margin-top:9px}.bar{height:100%;background:linear-gradient(90deg,#47c6c9,#6aa7df);width:0;transition:width .3s}.lesson{border:1px solid var(--line);background:#f6f9fc;border-radius:12px;padding:18px;line-height:1.8;margin:18px 0}.choice{display:block;width:100%;text-align:left;border:1px solid #bdcbd6;border-radius:11px;padding:13px 15px;margin:9px 0;background:white;font:500 14px Poppins,Arial,sans-serif;color:var(--ink);cursor:pointer}.choice:hover:not(:disabled){border-color:var(--blue);background:#edf5fc}.choice:disabled{opacity:.6;cursor:default}button.btn{font:700 13px Poppins;cursor:pointer;border:0;border-radius:11px;padding:12px 16px;background:var(--blue);color:white;margin:14px 8px 3px 0}button:disabled{opacity:.48;cursor:not-allowed}.good,.bad{padding:13px;border-radius:12px;margin:15px 0;font-size:13px}.good{background:#e4f4ed;color:#126451}.bad{background:#fff2ee;color:#8b2d26}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fields label{font-size:12px;font-weight:700}input,select{display:block;width:100%;border:1px solid #bdcbd6;border-radius:11px;padding:11px 12px;margin-top:6px;font:14px Poppins,Arial;background:#fff}.factors{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0}.factor{background:#edf5fc;border:1px solid #d8e3ec;border-radius:12px;padding:14px 7px;text-align:center;font-size:11px}.factor b{display:block;font-size:23px;color:var(--blue)}.cert{text-align:center;border:2px solid var(--blue);border-radius:16px;padding:30px;margin:18px 0}.cert h2{font-size:25px}.cert strong{font-size:30px;color:var(--blue)}@media(max-width:640px){header{flex-wrap:wrap}.panel{padding:16px}.fields{grid-template-columns:1fr}.factors{grid-template-columns:repeat(2,1fr)}}@media print{header,.hero,.btn{display:none!important}body{background:white}.shell{margin:0;width:100%}.panel{border:0;box-shadow:none}.cert{break-inside:avoid}}</style></head><body><header><b>MR. D'S HQ · PERSONAL FINANCE</b><a href="/pfm/">← Back to Personal Finance</a></header><div class="shell"><section class="hero"><div class="eyebrow">PFM MODULE 21 · INTERACTIVE LEARNING</div><h1>Credit Scores Explained</h1><p>Understand credit scores, the three credit bureaus, five scoring factors, and the habits that protect your financial future.</p><div class="progressrow"><span id="heroStatus">Ready to begin</span><span id="heroScore">0 / 12 checkpoints</span></div><div class="progress"><div class="bar" id="heroFill"></div></div></section><div id="app"></div></div><script>
const lessons=[["Credit score fundamentals","A credit score estimates how likely a borrower is to repay as agreed. Many FICO scores range from 300 to 850. A score is not your income, bank balance, or a guarantee of approval.",[["Which is the most accurate description of a credit score?",["A measure of repayment risk based on credit information","The amount of money in a checking account","A government-issued borrowing limit"],0],["Which is a common FICO score range?",["0–100","300–850","500–1000"],1]]],["Credit bureaus vs. credit unions","Equifax, Experian, and TransUnion are the three nationwide consumer credit bureaus. They collect credit-report information. A credit union is a financial institution, not a credit bureau. Bureaus do not themselves set one universal score.",[["Which group contains the three nationwide credit bureaus?",["Visa, Mastercard, Discover","Equifax, Experian, TransUnion","Chase, Wells Fargo, Capital One"],1],["A credit union is best described as…",["A member-owned financial institution","One of the three national credit bureaus","A type of FICO scoring formula"],0]]],["Five FICO factors","Typical FICO weighting: payment history 35%, amounts owed 30%, length of credit history 15%, new credit 10%, credit mix 10%. These are general category weights, not a fixed formula for every person. Amounts owed includes more than utilization.",[["Which factor usually carries the greatest weight?",["Credit mix","Payment history","New credit"],1],["Which pair together accounts for about 65% of typical FICO weighting?",["Payment history and amounts owed","Credit mix and new credit","Length of history and credit mix"],0]]],["Utilization lab","Credit utilization is revolving credit balances divided by revolving credit limits. Example: $450 owed on a $1,500 limit is 30%. Lower utilization generally helps, but 30% is not a magic cutoff. Paying in full and on time avoids unnecessary interest.",[["A $200 balance on a $1,000 limit is what utilization?",["2%","20%","50%"],1],["A student owes $900 on a $1,500 card. Which action generally lowers utilization?",["Paying down the balance","Making several new applications","Missing the payment"],0]]],["Real-world consequences","Lenders may use credit reports, scores, income, and debt when making decisions. A stronger credit profile can help qualify for better terms, but rates also depend on the lender, market, and borrower. Checking your own report is a soft inquiry; applying for credit can trigger a hard inquiry.",[["Which activity generally does not hurt your credit score?",["Checking your own credit report","Missing a payment","Applying for several loans in a short period"],0],["Why can a higher interest rate matter?",["It can increase total borrowing cost","It always lowers the monthly payment","It changes a debit card into a credit card"],0]]],["Build, check and protect","Build credit by paying on time, keeping balances manageable, and limiting unnecessary applications. Reports can be requested at AnnualCreditReport.com. A credit freeze is free and restricts access to your report for many new-credit applications; it does not erase debt or prevent every kind of fraud. Dispute errors with the bureau and furnisher.",[["Where is the federally authorized website to request free credit reports?",["AnnualCreditReport.com","CreditUnionScores.com","FICO.gov"],0],["What does a credit freeze primarily do?",["Block many new-credit checks until lifted","Erase all past late payments","Guarantee identity theft cannot occur"],0]]]],endpoint='https://script.google.com/macros/s/AKfycbyucfQcDDR9S_4i8_EiI2LAm0k49NNGT0IBiRnXTjZQKgtfuOwM73Wtxxt5fzojGFY/exec';let state={step:-1,q:0,answers:[],tries:0,first:'',last:'',block:'',started:Date.now(),submitted:false};const app=document.getElementById('app');function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function render(){let total=lessons.length*2,done=state.answers.length;document.getElementById('heroScore').textContent=done+' / '+total+' checkpoints';document.getElementById('heroStatus').textContent=state.step<0?'Ready to begin':state.step>=lessons.length?'Completed':'Lesson '+(state.step+1)+' of '+lessons.length;document.getElementById('heroFill').style.width=Math.round(done/total*100)+'%';if(state.step<0){app.innerHTML='<div class="panel"><div class="eyebrow">Personal Finance · Interactive Learning</div><h1>Credit Scores Explained</h1><p>Understand your credit score, the three credit bureaus, the five scoring factors, utilization, borrowing costs and protecting your identity.</p><p class="muted">Six guided lessons · 12 scored checkpoints · two attempts per question · certificate · Google Sheets submission</p><div class="fields"><label>First name<input id="first" autocomplete="given-name"></label><label>Last name<input id="last" autocomplete="family-name"></label><label>Class period / block<select id="block"><option value="">Choose</option><option>1</option><option>2</option><option>3</option><option>4</option><option>A</option><option>B</option></select></label></div><button class="btn" onclick="start()">Begin Module 21 →</button></div>';return}if(state.step>=lessons.length){let score=state.answers.reduce((a,x)=>a+x.points,0),pct=Math.round(score/total*100);app.innerHTML='<div class="panel"><div class="eyebrow">Module completed</div><h1>'+pct+'% · '+score+'/'+total+'</h1><div class="cert"><div class="eyebrow">Mr. D · Personal Financial Management</div><h2>Certificate of Completion</h2><p>Awarded to</p><h2>'+esc(state.first+' '+state.last)+'</h2><p>Credit Scores Explained · Module 21</p><strong>'+pct+'%</strong><p>Completion ID: '+esc(state.session)+'</p></div><p id="status" class="muted">'+esc(state.status||'Ready to submit to Google Sheets.')+'</p><button class="btn" onclick="submit()">Submit / Retry Google Sheets</button> <button class="btn" onclick="window.print()">Print certificate</button></div>';return}let l=lessons[state.step],q=l[2][state.q],record=state.answers[done-1],active=state.active,feedback=active?'<div class="'+(active.correct?'good':'bad')+'">'+(active.correct?'Correct.':active.locked?'Review the correct answer: '+esc(q[1][q[2]]):'Try again. Re-read the lesson and choose another answer.')+'</div>':'';app.innerHTML='<div class="panel"><div class="eyebrow">Lesson '+(state.step+1)+' of '+lessons.length+' · Checkpoint '+(state.q+1)+' of 2</div><h1>'+esc(l[0])+'</h1><div class="lesson">'+esc(l[1])+'</div>'+(state.step===2?'<div class="factors"><div class="factor"><b>35%</b>Payment history</div><div class="factor"><b>30%</b>Amounts owed</div><div class="factor"><b>15%</b>History length</div><div class="factor"><b>10%</b>New credit</div><div class="factor"><b>10%</b>Credit mix</div></div>':'')+'<h2>'+esc(q[0])+'</h2>'+q[1].map((v,i)=>'<button class="choice" '+(active?.locked?'disabled':'')+' onclick="answer('+i+')">'+String.fromCharCode(65+i)+'. '+esc(v)+'</button>').join('')+feedback+'<button class="btn" '+(!active?.locked?'disabled':'')+' onclick="next()">Continue →</button><p class="muted">Question '+(done+1)+' of '+total+'. Two attempts maximum.</p></div>'}window.start=()=>{let f=document.getElementById('first').value.trim(),l=document.getElementById('last').value.trim(),b=document.getElementById('block').value;if(!f||!l||!b){alert('Enter your name and class period.');return}Object.assign(state,{first:f,last:l,block:b,step:0,session:'PFM22-'+Date.now().toString(36)});render()};window.answer=i=>{if(state.active?.locked)return;let q=lessons[state.step][2][state.q],tries=(state.active?.tries||0)+1,correct=i===q[2],locked=correct||tries>=2;state.active={tries,correct,locked,selected:i};if(locked)state.answers.push({lesson:state.step+1,question:state.q+1,selected:i,correct,points:correct?(tries===1?1:.5):0});render()};window.next=()=>{if(!state.active?.locked)return;state.active=null;if(state.q===0)state.q=1;else{state.q=0;state.step++}render();if(state.step>=lessons.length)submit()};window.submit=async()=>{if(state.submitted)return;let score=state.answers.reduce((a,x)=>a+x.points,0),mins=Math.max(1,Math.round((Date.now()-state.started)/60000)),name=state.first+' '+state.last,record={moduleId:'pfm-module-21-credit-scores',moduleTitle:'Personal Finance Module 21 - Credit Scores Explained',category:'Personal Finance',topic:'Credit Scores and Credit Reports',productType:'Interactive Module',moduleSize:'standard',score,totalQuestions:12,percent:Math.round(score/12*100)+'%',completed:'Yes',answers:JSON.stringify(state.answers),timeMinutes:mins,sessionId:state.session,studentName:name,firstName:state.first,lastName:state.last,classPeriod:state.block,version:'1.0-pfm-m21'};state.status='Submitting…';render();let body=new URLSearchParams({action:'moduleSubmit',manualEntry:'1',moduleNumber:'21',bellId:'PFM-MODULE-21-CREDIT-SCORES',label:record.moduleTitle,firstName:state.first,lastName:state.last,name,answer:JSON.stringify(record),late:'0',duration:String(mins),timestamp:new Date().toISOString(),cls:'Personal Finance',googleName:'Manual entry',schoolEmail:'',block:state.block});try{let res=await fetch(endpoint,{method:'POST',body}),data=await res.json();if(!data.success&&data.error!=='This completion was already submitted.')throw Error(data.error||'Unconfirmed');state.submitted=true;state.status='Google Sheets confirmed your submission.'}catch(e){state.status='Submission not confirmed. Retry while connected or show your certificate to Mr. D.';console.error(e)}render()};render();
</script></body></html>
