<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><title>PFM Module 21 | Credit Scores Explained</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><style>:root{--navy:#102235;--blue:#2f6fb5;--cream:#f7f1e7;--ink:#172033;--muted:#667085;--line:#d8e0e7;--green:#18776f}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,var(--cream),#eef5f8 55%,#f8fafc);font-family:Poppins,Arial,sans-serif;color:var(--ink);line-height:1.58}header{background:var(--navy);color:white;padding:16px max(18px,calc((100vw - 1160px)/2));display:flex;justify-content:space-between;align-items:center;gap:16px}header b{font-size:18px}header a{color:#d9eafa;text-decoration:none;font-size:13px}.shell{width:min(1080px,92%);margin:24px auto 70px}.hero{background:linear-gradient(135deg,#102235,#173d58 68%,#1b6e73);color:white;border-radius:30px;padding:30px;box-shadow:0 18px 42px rgba(15,23,42,.13);margin-bottom:20px}.hero h1{font-size:clamp(2rem,4.7vw,3.7rem);letter-spacing:-.055em;line-height:1.04;margin:10px 0 14px;color:white}.hero p{color:#dce8ef;line-height:1.7}.eyebrow{font-size:.76rem;font-weight:900;letter-spacing:.14em;color:#b9ece7;text-transform:uppercase}.panel{background:white;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 10px 28px rgba(15,23,42,.06);margin-bottom:18px}h1{font-size:clamp(24px,3vw,32px);line-height:1.2}h2{font-size:21px}.muted{color:var(--muted);font-size:13px;line-height:1.65}.progressrow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#c6f0ec;font-weight:800;font-size:.86rem;margin-top:20px}.progress{height:9px;background:rgba(255,255,255,.16);border-radius:999px;overflow:hidden;margin-top:9px}.bar{height:100%;background:linear-gradient(90deg,#47c6c9,#6aa7df);width:0;transition:width .3s}.lesson{border:1px solid var(--line);background:#f6f9fc;border-radius:12px;padding:18px;line-height:1.8;margin:18px 0}.choice{display:block;width:100%;text-align:left;border:1px solid #bdcbd6;border-radius:11px;padding:13px 15px;margin:9px 0;background:white;font:500 14px Poppins,Arial,sans-serif;color:var(--ink);cursor:pointer}.choice:hover:not(:disabled){border-color:var(--blue);background:#edf5fc}.choice:disabled{opacity:.6;cursor:default}button.btn{font:700 13px Poppins;cursor:pointer;border:0;border-radius:11px;padding:12px 16px;background:var(--blue);color:white;margin:14px 8px 3px 0}button:disabled{opacity:.48;cursor:not-allowed}.good,.bad{padding:13px;border-radius:12px;margin:15px 0;font-size:13px}.good{background:#e4f4ed;color:#126451}.bad{background:#fff2ee;color:#8b2d26}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fields label{font-size:12px;font-weight:700}input,select{display:block;width:100%;border:1px solid #bdcbd6;border-radius:11px;padding:11px 12px;margin-top:6px;font:14px Poppins,Arial;background:#fff}.factors{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0}.factor{background:#edf5fc;border:1px solid #d8e3ec;border-radius:12px;padding:14px 7px;text-align:center;font-size:11px}.factor b{display:block;font-size:23px;color:var(--blue)}.cert{text-align:center;border:2px solid var(--blue);border-radius:16px;padding:30px;margin:18px 0}.cert h2{font-size:25px}.cert strong{font-size:30px;color:var(--blue)}@media(max-width:640px){header{flex-wrap:wrap}.panel{padding:16px}.fields{grid-template-columns:1fr}.factors{grid-template-columns:repeat(2,1fr)}}@media print{header,.hero,.btn{display:none!important}body{background:white}.shell{margin:0;width:100%}.panel{border:0;box-shadow:none}.cert{break-inside:avoid}} .resource{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.resource a{background:#e9f2fa;color:#102235;padding:9px 12px;border-radius:10px;font-size:12px;font-weight:700;text-decoration:none}.resource a:hover{text-decoration:underline}.sample-report{background:white;border:1px solid #bdcbd6;padding:18px;border-radius:12px;margin:18px 0}.sample-report div{border-bottom:1px solid #e2e8f0;padding:8px 0;font-size:13px}.sample-report small{color:#667085}.example{background:#f6f9fc;border:1px solid #d8e0e7;padding:15px;border-radius:12px;margin:16px 0}.lesson a{color:#2f6fb5;font-weight:700} </style></head><body><header><b>MR. D'S HQ · PERSONAL FINANCE</b><a href="/pfm/">← Back to Personal Finance</a></header><div class="shell"><section class="hero"><div class="eyebrow">PFM MODULE 21 · INTERACTIVE LEARNING</div><h1>Credit Scores Explained</h1><p>Understand credit scores, the three credit bureaus, five scoring factors, and the habits that protect your financial future.</p><div class="progressrow"><span id="heroStatus">Ready to begin</span><span id="heroScore">0 / 30 checkpoints</span></div><div class="progress"><div class="bar" id="heroFill"></div></div></section><div id="app"></div></div><script>
const lessons=[["What a credit score actually measures","A credit report is a record of credit accounts, balances, payment history, inquiries and certain public records. A credit score is a number calculated from information in a report, not a measure of your worth or income. Common base FICO scores range from 300 to 850. Different scoring models and bureaus can produce different scores. Lenders also consider income, debt and other factors. A strong score may improve your options but never guarantees approval.",[["A 19-year-old has $3,000 in savings but has never borrowed. What can you conclude?",["They automatically have excellent credit","They may have little or no scoreable credit history","Their savings count as on-time loan payments","Their score must be 300"],1],["A lender checks one bureau while a credit app displays another score model. Why might the numbers differ?",["One of the scores must be fraudulent","Different bureau data and scoring models can produce different scores","A credit score never changes","Every lender must use the app score"],1],["A borrower has a 760 score but insufficient income for a large loan. Which outcome is realistic?",["Approval is required by law","The score substitutes for income verification","The lender may still decline based on ability to repay","The lender cannot review debts"],2]]],["The three nationwide credit bureaus","The three nationwide credit reporting companies are <strong>Equifax, Experian and TransUnion</strong>. They compile reports; they are not credit unions, lenders or the creators of a single universal score. Not every creditor reports to all three, so reports may differ. Explore their public consumer education pages below. Do not sign in, register, buy products or submit identifying information for this class activity.<div class=\"resource\"><a href=\"https://www.equifax.com/personal/education/\" target=\"_blank\" rel=\"noopener\">Equifax consumer education ↗</a><a href=\"https://www.experian.com/blogs/ask-experian/\" target=\"_blank\" rel=\"noopener\">Experian credit education ↗</a><a href=\"https://www.transunion.com/credit-help\" target=\"_blank\" rel=\"noopener\">TransUnion credit help ↗</a></div><p><strong>Website scavenger hunt:</strong> Open all three. Locate an explanation of a credit report, find information about a dispute or freeze, and notice how each website distinguishes free educational content from optional paid services. Then answer the checkpoints.</p>",[["Which set names the nationwide consumer credit reporting companies?",["Equifax, Experian and TransUnion","Visa, Mastercard and Discover","FICO, VantageScore and Fair Isaac","Chase, Citi and Wells Fargo"],0],["You see a collection account on Experian but not TransUnion. Which is the best explanation?",["All three must always show identical information","Different creditors may report to different bureaus","Experian is a bank and TransUnion is not","Only one bureau is allowed to record collections"],1],["A website asks you to buy a subscription while learning about your credit report. What is the best action for this class activity?",["Buy it to receive credit","Enter your Social Security number","Use the free public educational information without registering","Apply for a credit card through the website"],2]]],["Inside a sample credit report","A typical report contains identifying information, account details, balances, limits, payment history, inquiries and possibly collections or bankruptcies. A report does not generally show your checking account balance, salary or a single permanent credit score. <div class=\"sample-report\"><strong>FICTIONAL CREDIT REPORT — Jordan Rivera</strong><div>Account A: Student card · Opened Aug 2024 · Limit $1,000 · Balance $180 · On-time payments</div><div>Account B: Auto loan · Opened Mar 2025 · Balance $8,400 · One payment 30 days late</div><div>Inquiry: Auto financing application · Mar 2025</div><div>Personal details: Name and previous addresses (not shown)</div><small>Classroom illustration only; not a real consumer report.</small></div>Read every line. Which items might affect a score? Which would you verify if this were your report? Consumers can request free reports from <a href=\"https://www.annualcreditreport.com/\" target=\"_blank\" rel=\"noopener\">AnnualCreditReport.com ↗</a>, the federally authorized site.",[["In Jordan's fictional report, what is the student card utilization?",["8%","18%","55%","82%"],1],["Which item in Jordan's sample report most directly signals a payment-history problem?",["A credit limit of $1,000","A 30-day late auto-loan payment","An account opening date","A previous mailing address"],1],["Jordan notices an auto loan that is not theirs. What should they do?",["Ignore it until the loan is paid","Dispute the error with the bureau and information provider","Apply for another loan to offset it","Close every checking account"],1]]],["The five FICO scoring factors","For a typical base FICO score, the general category weights are <strong>payment history 35%</strong>, <strong>amounts owed 30%</strong>, <strong>length of credit history 15%</strong>, <strong>new credit 10%</strong> and <strong>credit mix 10%</strong>. These are broad weights, not a promise that a particular action adds a fixed number of points. Amounts owed includes utilization but is broader than utilization alone. Payment history means whether obligations were paid as agreed.<div class=\"factors\"><div class=\"factor\"><b>35%</b>Payments</div><div class=\"factor\"><b>30%</b>Amounts owed</div><div class=\"factor\"><b>15%</b>History length</div><div class=\"factor\"><b>10%</b>New credit</div><div class=\"factor\"><b>10%</b>Credit mix</div></div>",[["Which factor typically has the largest weight in base FICO scoring?",["Credit mix","Payment history","New credit","Length of history"],1],["Which two categories together account for about 65% of typical weighting?",["History length and mix","New credit and mix","Payment history and amounts owed","History length and new credit"],2],["Someone applies for four new cards in one week to improve credit mix. What is the concern?",["New applications can create hard inquiries and reduce average account age","Credit mix always outweighs payment history","All new accounts erase old late payments","Opening cards immediately guarantees a score increase"],0]]],["Utilization and smart card habits","Credit card utilization = <strong>reported revolving balances ÷ credit limits × 100</strong>. Example: $450 ÷ $1,500 = 30%. Lower reported utilization generally helps, but 30% is not a magic cutoff. Your statement balance may be reported before the payment due date. Paying the <strong>full statement balance by the due date</strong> generally avoids purchase interest when a grace period applies; you do not need to carry interest-bearing debt to build credit. Never miss the minimum payment.<div class=\"example\"><strong>Try the math:</strong> Card A has $600 owed on a $2,000 limit; Card B has $150 owed on a $1,000 limit. Total utilization = $750 ÷ $3,000 = 25%.</div>",[["A card has a $1,600 limit and a $400 reported balance. What is utilization?",["15%","20%","25%","40%"],2],["Two cards have combined limits of $5,000 and combined balances of $1,250. What is overall utilization?",["15%","20%","25%","35%"],2],["Which habit can build positive payment history without paying purchase interest unnecessarily?",["Carry a balance every month","Pay the full statement balance on time when the grace period applies","Skip small payments to keep the account active","Make only the minimum payment forever"],1]]],["Your first credit card: secured or unsecured?","An <strong>unsecured card</strong> generally does not require a cash security deposit; approval and terms depend on the issuer's criteria. A <strong>secured card</strong> usually requires a refundable security deposit that often influences the limit; it is still real credit and may charge fees or interest. Before applying, compare annual fee, APR, deposit, credit bureau reporting, grace period and whether the issuer offers a path to an unsecured card. A debit card spends your bank funds and ordinarily does not build a credit history. Under 21, U.S. credit card applicants face special ability-to-pay or qualifying co-signer/joint-applicant rules; many issuers do not allow co-signers.<div class=\"example\"><strong>Starter comparison:</strong> Card A: secured, $300 deposit, $0 annual fee, reports to all three bureaus. Card B: unsecured, $95 annual fee, no deposit. Neither is automatically best for everyone; compare total costs and eligibility.</div>",[["What makes a secured credit card different from most unsecured cards?",["A secured card typically requires a refundable deposit","A secured card is the same as a debit card","A secured card never reports payments","A secured card has no possible interest charges"],0],["For a first card, which feature is especially valuable for building a record?",["Reports on-time activity to major credit bureaus","Offers the largest advertised credit limit","Requires carrying a monthly balance","Guarantees no credit check for every applicant"],0],["A young adult can afford a $300 deposit and wants to avoid a $95 annual fee. Which comparison is most reasonable?",["A secured card with no annual fee may be worth considering","The unsecured card is always cheaper","The deposit is always a permanent fee","Neither card can build credit"],0]]],["Co-signers, authorized users and age rules","A <strong>co-signer</strong> agrees to repay if the primary borrower does not; missed payments and defaults can harm both parties' credit and finances. On some products a <strong>joint borrower</strong> shares direct responsibility. An <strong>authorized user</strong> may use another person's credit card but generally is not contractually responsible for the bill; whether the account helps the user's score depends on reporting and scoring rules. These roles are not interchangeable. Students under 18 generally cannot open their own credit card account. Some issuers permit minors to be authorized users with adult oversight. At 18–20, applicants need to meet applicable ability-to-pay requirements or qualify through an allowed arrangement.",[["A parent co-signs a $12,000 auto loan. The student stops paying. What risk does the parent face?",["The parent can be required to repay the debt","The parent's signature expires after 30 days","Only the student's credit can be affected","The parent automatically owns the vehicle free of debt"],0],["What is a key difference between an authorized user and a co-signer?",["An authorized user generally is not legally responsible for the card balance","An authorized user guarantees every payment","A co-signer cannot be pursued for missed payments","Both roles always create identical credit histories"],0],["A 17-year-old wants to start building credit responsibly. Which is a realistic possibility?",["Open any unsecured card alone","Become an authorized user if an issuer permits it and a trusted adult agrees","Sign a mortgage alone to establish history","Carry a balance on a prepaid debit card"],1]]],["Car loan lab: compare the true cost","A credit score is only one input into an auto-loan rate. For a fair comparison, hold the <strong>amount financed, term and fees</strong> constant and change only the hypothetical APR. The standard fixed-rate monthly payment is based on principal, monthly interest rate and number of payments. <div class=\"example\"><strong>Illustrative offers, not current quotes:</strong> Finance $24,000 for 60 months. Offer A: 6% APR → about <strong>$464/month</strong>, about <strong>$3,839</strong> interest. Offer B: 15% APR → about <strong>$571/month</strong>, about <strong>$10,258</strong> interest. Difference: roughly <strong>$107/month</strong> and <strong>$6,419</strong> total interest. Taxes, insurance and fees excluded.</div>",[["In the example, approximately how much more does the 15% APR loan cost each month?",["$27","$67","$107","$207"],2],["Which offer produces approximately $6,419 more total interest over five years?",["The 6% APR offer","The 15% APR offer","Both have the same total interest","Neither charges interest"],1],["Two dealerships offer the same APR, but one loan lasts 72 months instead of 48. What should you compare?",["Monthly payment and total interest over the full term","Only the color of the car","Only the advertised monthly payment","Only the dealership's brand"],0]]],["Mortgage lab and renting an apartment","Mortgage comparisons work similarly, but longer terms magnify rate differences. <div class=\"example\"><strong>Illustrative 30-year fixed mortgage:</strong> Borrow $240,000, principal and interest only. At 6% APR: about <strong>$1,439/month</strong>. At 8% APR: about <strong>$1,761/month</strong>. That's about <strong>$322/month</strong>, or approximately <strong>$116,000</strong> more over 360 payments. Property taxes, insurance, PMI, closing costs and HOA fees are excluded.</div>Landlords may screen credit reports, income, rental history, references and eviction records. <strong>There is no universal minimum rental credit score.</strong> Some properties set their own screening thresholds, while others accept guarantors, additional documentation or applicants with limited credit. Rules vary by location, and screening must comply with applicable law.",[["In the mortgage example, approximately how much more is the monthly principal-and-interest payment at 8%?",["$122","$222","$322","$522"],2],["Over 360 payments, a $322 monthly difference adds up to approximately how much?",["$11,600","$58,000","$116,000","$322,000"],2],["A renter with a 620 score asks whether every apartment requires 650. What is the best response?",["Yes, 650 is a federal minimum","No, screening standards vary by landlord and property","No landlord may review credit","Credit is the only factor a landlord can consider"],1]]],["Build, monitor and protect credit","A realistic starter plan: <strong>ages 16–17</strong> learn budgeting, keep a bank account in good standing and consider an authorized-user arrangement only with a responsible adult and issuer that allows it. <strong>At 18–20</strong> compare affordable student or secured cards if eligible, make small planned purchases, use autopay as a backup and check statements. <strong>In your twenties</strong> keep on-time payments, avoid unnecessary applications, maintain manageable balances and review reports. Never borrow solely to 'make a score.' Free credit reports are available through <a href=\"https://www.annualcreditreport.com/\" target=\"_blank\" rel=\"noopener\">AnnualCreditReport.com ↗</a>. A <strong>credit freeze</strong> is free, is placed separately with each bureau and helps block many new-credit openings; it does not erase debt or prevent every type of fraud. Checking your own report is a soft inquiry.",[["Which is the strongest practical first-year credit-building plan?",["Make small affordable charges and pay the statement balance on time","Apply for six cards to create history faster","Carry expensive interest to prove borrowing experience","Ignore statements if autopay is turned on"],0],["Where can consumers request federally authorized free credit reports?",["AnnualCreditReport.com","A random sponsored credit-score advertisement","A credit union membership directory","A loan application checkout page"],0],["What is a realistic purpose of a credit freeze?",["Restrict many new-credit applications until lifted","Remove all legitimate debt from reports","Guarantee that identity theft cannot happen","Automatically raise a score by 100 points"],0]]]],endpoint='https://script.google.com/macros/s/AKfycbyucfQcDDR9S_4i8_EiI2LAm0k49NNGT0IBiRnXTjZQKgtfuOwM73Wtxxt5fzojGFY/exec';let state={step:-1,q:0,answers:[],tries:0,first:'',last:'',block:'',started:Date.now(),submitted:false};const app=document.getElementById('app');function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function render(){let total=lessons.reduce((n,l)=>n+l[2].length,0),done=state.answers.length;document.getElementById('heroScore').textContent=done+' / '+total+' checkpoints';document.getElementById('heroStatus').textContent=state.step<0?'Ready to begin':state.step>=lessons.length?'Completed':'Lesson '+(state.step+1)+' of '+lessons.length;document.getElementById('heroFill').style.width=Math.round(done/total*100)+'%';if(state.step<0){app.innerHTML='<div class="panel"><div class="eyebrow">Personal Finance · Interactive Learning</div><h1>Credit Scores Explained</h1><p>Understand your credit score, the three credit bureaus, the five scoring factors, utilization, borrowing costs and protecting your identity.</p><p class="muted">Ten in-depth lessons · 30 scored checkpoints · two attempts per question · certificate · Google Sheets submission</p><div class="fields"><label>First name<input id="first" autocomplete="given-name"></label><label>Last name<input id="last" autocomplete="family-name"></label><label>Class period / block<select id="block"><option value="">Choose</option><option>1</option><option>2</option><option>3</option><option>4</option><option>A</option><option>B</option></select></label></div><button class="btn" onclick="start()">Begin Module 21 →</button></div>';return}if(state.step>=lessons.length){let score=state.answers.reduce((a,x)=>a+x.points,0),pct=Math.round(score/total*100);app.innerHTML='<div class="panel"><div class="eyebrow">Module completed</div><h1>'+pct+'% · '+score+'/'+total+'</h1><div class="cert"><div class="eyebrow">Mr. D · Personal Financial Management</div><h2>Certificate of Completion</h2><p>Awarded to</p><h2>'+esc(state.first+' '+state.last)+'</h2><p>Credit Scores Explained · Module 21</p><strong>'+pct+'%</strong><p>Completion ID: '+esc(state.session)+'</p></div><p id="status" class="muted">'+esc(state.status||'Ready to submit to Google Sheets.')+'</p><button class="btn" onclick="submit()">Submit / Retry Google Sheets</button> <button class="btn" onclick="window.print()">Print certificate</button></div>';return}let l=lessons[state.step],q=l[2][state.q],record=state.answers[done-1],active=state.active,feedback=active?'<div class="'+(active.correct?'good':'bad')+'">'+(active.correct?'Correct.':active.locked?'Review the correct answer: '+esc(q[1][q[2]]):'Try again. Re-read the lesson and choose another answer.')+'</div>':'';app.innerHTML='<div class="panel"><div class="eyebrow">Lesson '+(state.step+1)+' of '+lessons.length+' · Checkpoint '+(state.q+1)+' of '+l[2].length+'</div><h1>'+esc(l[0])+'</h1><div class="lesson">'+l[1]+'</div><h2>'+esc(q[0])+'</h2>'+q[1].map((v,i)=>'<button class="choice" '+(active?.locked?'disabled':'')+' onclick="answer('+i+')">'+String.fromCharCode(65+i)+'. '+esc(v)+'</button>').join('')+feedback+'<button class="btn" '+(!active?.locked?'disabled':'')+' onclick="next()">Continue →</button><p class="muted">Question '+(done+1)+' of '+total+'. Two attempts maximum.</p></div>'}window.start=()=>{let f=document.getElementById('first').value.trim(),l=document.getElementById('last').value.trim(),b=document.getElementById('block').value;if(!f||!l||!b){alert('Enter your name and class period.');return}Object.assign(state,{first:f,last:l,block:b,step:0,session:'PFM21-'+Date.now().toString(36)});render()};window.answer=i=>{if(state.active?.locked)return;let q=lessons[state.step][2][state.q],tries=(state.active?.tries||0)+1,correct=i===q[2],locked=correct||tries>=2;state.active={tries,correct,locked,selected:i};if(locked)state.answers.push({lesson:state.step+1,question:state.q+1,selected:i,correct,points:correct?(tries===1?1:.5):0});render()};window.next=()=>{if(!state.active?.locked)return;state.active=null;if(state.q<lessons[state.step][2].length-1)state.q++;else{state.q=0;state.step++}render();if(state.step>=lessons.length)submit()};window.submit=async()=>{if(state.submitted||state.sending)return;let score=state.answers.reduce((a,x)=>a+x.points,0),mins=Math.max(1,Math.round((Date.now()-state.started)/60000)),name=state.first+' '+state.last,record={moduleId:'pfm-module-21-credit-scores',moduleTitle:'Personal Finance Module 21 - Credit Scores Explained',category:'Personal Finance',topic:'Credit Scores and Credit Reports',productType:'Interactive Module',moduleSize:'standard',score,totalQuestions:30,percent:Math.round(score/30*100)+'%',completed:'Yes',answers:JSON.stringify(state.answers),timeMinutes:mins,sessionId:state.session,studentName:name,firstName:state.first,lastName:state.last,classPeriod:state.block,version:'2.0-pfm-m21'};state.status='Submitting…';state.sending=true;render();let body=new URLSearchParams({action:'moduleSubmit',manualEntry:'1',moduleNumber:'21',bellId:'PFM-MODULE-21-CREDIT-SCORES',label:record.moduleTitle,firstName:state.first,lastName:state.last,name,answer:JSON.stringify(record),late:'0',duration:String(mins),timestamp:new Date().toISOString(),cls:'Personal Finance',googleName:'Manual entry',schoolEmail:'',block:state.block});try{let res=await fetch(endpoint,{method:'POST',body}),data=await res.json();if(!data.success&&data.error!=='This completion was already submitted.')throw Error(data.error||'Unconfirmed');state.submitted=true;state.status='Google Sheets confirmed your submission.'}catch(e){state.status='Submission not confirmed. Retry while connected or show your certificate to Mr. D.';console.error(e)}state.sending=false;render()};render();
</script></body></html>
