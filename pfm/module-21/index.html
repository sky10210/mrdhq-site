in-top:7px}.metric{background:#faf9ff;border:1px solid #e6e2f5;border-radius:11px;padding:14px}.metric small{display:block;color:var(--muted)}.metric strong{display:block;font-size:21px;overflow-wrap:anywhere}.lesson{border-left:4px solid var(--purple);background:#f2efff;padding:16px 18px;margin:18px 0;border-radius:0 10px 10px 0}.choices{display:grid;gap:9px;margin:17px 0}.choice{border:1px solid #d9d8e4;background:white;border-radius:9px;padding:13px 15px;text-align:left;color:var(--ink)}.choice:hover:not(:disabled){border-color:var(--purple);background:#f9f7ff}.choice.selected{border:2px solid var(--purple);background:#f1edff}.choice:disabled{cursor:not-allowed}.feedback{padding:13px 16px;border:1px solid #e8d3be;background:#fff8f0;border-radius:11px;margin:13px 0}.feedback.good{background:#f0fbf5;border-color:#bad9ca}.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{background:var(--purple);border:0;border-radius:9px;color:white;padding:12px 19px;font-weight:700}.btn.secondary{background:#e9e5f6;color:#272447}.btn:disabled{opacity:.4;cursor:not-allowed}.filegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.file{border:1px solid var(--line);background:white;border-radius:12px;padding:17px;text-align:left;display:grid;gap:4px}.file:disabled{opacity:.36;cursor:not-allowed}.file strong{font-size:17px}.muted{color:var(--muted)}.policy{border:1px solid #e4dccb;background:#fbfaf5;padding:18px;border-radius:11px}.policy li{margin:6px 0}.pill{background:#eee9ff;color:#5c3ab1;border-radius:20px;padding:4px 11px;font-size:11px;font-weight:700}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center}.cert{border:4px double #b1a0e5;text-align:center;padding:25px;background:white}.cert h2{font-size:30px}.reportscore{font:700 46px 'JetBrains Mono',monospace;color:var(--purple)}.status{margin:15px 0;font-weight:600}.note{font-size:12px;color:var(--muted)}.hide{display:none!important}

</style></head><body><div class="layout"><aside class="side"><a class="brand" href="/pfm/"><div class="brand-icon">▣</div><div><b>Personal Finance</b><small>MR. D · INTERACTIVE MODULE</small></div></a><div class="meter"><span class="tiny">SHIFT PROGRESS</span><strong id="completed">0 / 8</strong><div class="track"><div id="bar" style="width:0"></div></div><span class="tiny">Applicant files completed</span></div><p class="tiny">CREDIT ANALYST TRAINING</p><div id="navigation"></div></aside><section class="main"><div class="hero"><span class="eyebrow">PFM MODULE 21 · CAREER SIMULATION</span><h1>Credit Analyst Academy</h1><p>A day in the life of a credit card underwriting analyst</p></div><main class="content" id="app"></main></section></div><script>window.CASES=[{"name":"Jordan Lee","age":19,"job":"Retail associate","income":2400,"debt":450,"score":0,"balance":0,"limit":0,"late":0,"years":0,"inquiries":0,"serious":0,"purpose":"First card for gas and emergencies"},{"name":"Morgan Patel","age":27,"job":"Medical assistant","income":4200,"debt":850,"score":742,"balance":750,"limit":6000,"late":0,"years":5,"inquiries":1,"serious":0,"purpose":"Cash-back card for groceries"},{"name":"Alex Rivera","age":32,"job":"Sales representative","income":6500,"debt":1600,"score":681,"balance":9200,"limit":10000,"late":0,"years":7,"inquiries":2,"serious":0,"purpose":"Travel rewards"},{"name":"Sam Brooks","age":22,"job":"Warehouse technician","income":3100,"debt":650,"score":654,"balance":850,"limit":2500,"late":1,"years":2,"inquiries":1,"serious":0,"purpose":"Everyday rewards"},{"name":"Taylor Kim","age":29,"job":"Graphic designer","income":4700,"debt":1100,"score":706,"balance":1000,"limit":5000,"late":0,"years":6,"inquiries":5,"serious":0,"purpose":"Business travel"},{"name":"Casey Nguyen","age":41,"job":"Electrician","income":5900,"debt":1300,"score":783,"balance":2400,"limit":16000,"late":0,"years":15,"inquiries":0,"serious":0,"purpose":"Household expenses"},{"name":"Drew Johnson","age":35,"job":"Delivery driver","income":3500,"debt":900,"score":592,"balance":3500,"limit":5000,"late":2,"years":8,"inquiries":1,"serious":1,"purpose":"Rebuild credit"},{"name":"Riley Davis","age":38,"job":"Project manager","income":7200,"debt":3900,"score":790,"balance":1200,"limit":20000,"late":0,"years":12,"inquiries":0,"serious":0,"purpose":"Premium travel"}];window.SHEET="https://script.google.com/macros/s/AKfycbyucfQcDDR9S_4i8_EiI2LAm0k49NNGT0IBiRnXTjZQKgtfuOwM73Wtxxt5fzojGFY/exec";(function client(){
const $=s=>document.querySelector(s); const money=n=>'$'+Number(n).toLocaleString('en-US');const escape=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');
const cases=window.CASES,sheet=window.SHEET;
const VERSION='pfm-module-21-v2';let state={first:'',last:'',block:'',screen:'welcome',caseIndex:0,step:0,answers:{},results:{},started:0,submitted:false,status:'',session:''};
try{const saved=JSON.parse(localStorage.getItem(VERSION));if(saved)state={...state,...saved}}catch(e){}
const save=()=>{try{localStorage.setItem(VERSION,JSON.stringify(state))}catch(e){}};
const utilization=c=>c.limit?100*c.balance/c.limit:null;
const dti=c=>100*c.debt/c.income;
const factor=(c,s)=>{
if(s===0)return 1;
if(s===1)return c.serious?2:c.late?1:0;
if(s===2){let u=utilization(c);return u===null||u<50?0:u<=85?1:2}
if(s===3)return c.score>0&&c.score<600?2:(!c.score||c.score<670||c.inquiries>=4)?1:0;
if(s===4){let d=dti(c);return d>50?2:d>35?1:0}
};
const expected=c=>{let a=[0,1,2,3,4].map(i=>factor(c,i));let rank=Math.max(a[1],a[2],a[3],a[4]);let decision=['APPROVE','MANUAL REVIEW','DENY'][rank];let limit=rank===0?(c.score>=760?5000:c.score>=720?3000:1500):0;return {decision,limit}};
const policy='<div class="policy"><strong>Harbor Bank: fictional underwriting rules</strong><ul><li>Recent serious delinquency: DENY. Recent 30-day late payment: REVIEW.</li><li>Utilization above 85%: DENY; from 50% through 85%: REVIEW.</li><li>Credit score below 600: DENY; 600–669 or no established score: REVIEW.</li><li>Four or more recent applications: REVIEW.</li><li>Monthly debt payments over 50% of gross income: DENY; over 35% to 50%: REVIEW.</li><li>All checks passed: approved limit is $1,500 for scores 670–719, $3,000 for 720–759, or $5,000 for 760+.</li><li>Always apply the strictest rule: denial overrides review, and review overrides approval.</li></ul><span class="note">These thresholds are for this classroom activity, not real bank guidelines. Decisions cannot rely on protected traits. Age is included only as applicant background, not a scoring input.</span></div>';
const titles=['Intake and identity','Payment history','Credit utilization','Credit report','Ability to pay','Credit committee decision'];
const explain=(c,s)=>[
'Review an entire application and bank policy before deciding. A credit card uses borrowed money, not funds directly from checking.',
'Payment history reflects whether bills were paid on time. No credit record is different from a history of missed payments.',
'Utilization means card balance divided by existing card limit, times 100. No established credit limit is not 0% utilization.',
'Credit score, length of history, and recent inquiries are separate pieces of evidence. Income does not count toward a FICO score.',
'For this fictional exercise, debt burden is monthly debt payments divided by gross monthly income. Real ability-to-pay rules involve more information.',
'Use the most restrictive finding to determine a decision. Set a limit only if the file passes every review.'
][s];
const qdata=(c,s)=>{
if(s===0)return ['Approve immediately because the applicant has a job','Check the entire credit file and bank policy','Deny applicants who are young'];
if(s===1)return ['Payment record passes this bank check','Recent late payment: send to manual review','Serious delinquency: deny under bank policy'];
if(s===2)return ['Pass or no established credit card limit','50–85%: manual review','Above 85%: deny'];
if(s===3)return ['Credit profile passes this bank check','Score, thin file, or inquiries require manual review','Score below 600: deny'];
if(s===4)return ['35% or less: pass','Above 35% through 50%: review','Above 50%: deny'];
};
function nav(){let done=Object.keys(state.results).length;$('#completed').textContent=done+' / 8';$('#bar').style.width=done/8*100+'%';$('#navigation').innerHTML=cases.map((c,i)=>`<button class="navitem ${state.caseIndex===i&&state.screen==='file'?'active':''} ${state.results[i]?'done':''}" ${i>done||!state.first?'disabled':''} onclick="window.openCase(${i})"><span class="dot">${state.results[i]?'✓':i+1}</span>${escape(c.name)}</button>`).join('');}
function render(){save();nav();const app=$('#app');let done=Object.keys(state.results).length;
if(state.screen==='welcome'){app.innerHTML=`<div class="card intro"><span class="eyebrow">Employee onboarding</span><h2>Welcome to your first shift.</h2><p>You are a junior credit analyst reviewing eight fictional applicants. Follow the same six-step workflow for every file, apply the bank's policy, and make a documented approval decision.</p></div><div class="card"><h3>Employee identification</h3><div class="grid"><label>First name<input id="first" class="input" autocomplete="given-name" value="${escape(state.first)}"></label><label>Last name<input id="last" class="input" autocomplete="family-name" value="${escape(state.last)}"></label><label>Class block<select id="block" class="input"><option value="">Choose block</option>${[1,2,3,4].map(n=>`<option value="Block ${n}" ${state.block==='Block '+n?'selected':''}>Block ${n}</option>`).join('')}</select></label></div><button class="btn" onclick="window.clockIn()">Clock in and open queue</button></div><div class="card"><h3>What you will learn</h3><p>Payment history, credit utilization, credit scores, credit inquiries, debt-to-income, lending decisions, and credit limits.</p></div>`;return}
if(state.screen==='queue'){app.innerHTML=`<div class="eyebrow">Analyst ${escape(state.first+' '+state.last)} · ${escape(state.block)}</div><h2>Application queue</h2><p class="muted">Work through the files in order. Submitted decisions unlock the next applicant.</p><div class="filegrid">${cases.map((c,i)=>`<button class="file" ${i>done?'disabled':''} onclick="window.openCase(${i})"><span class="eyebrow">FILE ${i+1} OF 8</span><strong>${escape(c.name)}</strong><span class="note">${state.results[i]?'Completed · '+state.results[i].points+'/6':'Awaiting analysis'}</span></button>`).join('')}</div><div class="card"><h3>Analyst policy handbook</h3>${policy}</div>${done===8?'<button class="btn" onclick="window.showReport()">Open performance report</button>':''}`;return}
if(state.screen==='report'){let total=Object.values(state.results).reduce((n,r)=>n+r.points,0),pct=Math.round(100*total/48);app.innerHTML=`<div class="eyebrow">End of shift</div><h2>Performance report</h2><div class="card"><h3>${escape(state.first+' '+state.last)} · ${escape(state.block)}</h3><div class="reportscore">${pct}%</div><p>${total} / 48 points · Eight applications reviewed</p>${cases.map((c,i)=>`<p>${i+1}. ${escape(c.name)} <strong style="float:right">${state.results[i].points}/6</strong></p>`).join('')}<div class="btnrow"><button class="btn" onclick="window.print()">Print report or save PDF</button><button class="btn secondary" onclick="window.backQueue()">Review files</button></div></div><div class="cert"><span class="eyebrow">Mr. D · Personal Finance</span><h2>Certificate of Completion</h2><p>This recognizes</p><h2>${escape(state.first+' '+state.last)}</h2><p>for completing Credit Analyst Academy</p><h3>${pct}% · ${total}/48 points</h3><p class="note">Module 21 · 8 credit files</p></div><div class="card"><h3>Google Sheets submission</h3><p id="submitStatus" class="status">${escape(state.status||'Submitting your score…')}</p>${state.submitted?'':`<button class="btn" onclick="window.submitSheet()">Retry submission</button>`}</div>`;return}
let i=state.caseIndex,c=cases[i],step=state.step,a=state.answers[i]||{},r=state.results[i],e=expected(c);
let info='';
if(step===0)info=`<p class="muted">${escape(c.job)} · Application purpose: ${escape(c.purpose)}</p><div class="grid">${metric('Gross monthly income',money(c.income))}${metric('Debt payments per month',money(c.debt))}${metric('Credit score',c.score||'Not established')}</div>`;
if(step===1)info=`<div class="grid">${metric('Recent 30-day late payments',c.late)}${metric('Serious recent delinquency',c.serious?'Yes':'No')}${metric('Credit history',c.years+' years')}</div>`;
if(step===2)info=`<div class="grid">${metric('Card balances',money(c.balance))}${metric('Existing card limits',money(c.limit))}${metric('Utilization',c.limit?Math.round(utilization(c))+'%':'Not established')}</div>`;
if(step===3)info=`<div class="grid">${metric('Credit score',c.score||'Unscored')}${metric('Years of credit history',c.years)}${metric('Recent inquiries',c.inquiries)}</div>`;
if(step===4)info=`<div class="grid">${metric('Gross monthly income',money(c.income))}${metric('Existing monthly debt',money(c.debt))}${metric('Debt burden',Math.round(dti(c))+'%')}</div>`;
const record=a['s'+step], submitted=!!r;
let choices='';
if(step<5){let opts=qdata(c,step);choices=`<h3>Analyst checkpoint</h3><div class="choices">${opts.map((v,j)=>`<button class="choice ${record&&record.selected===j?'selected':''}" ${submitted||record?.locked?'disabled':''} onclick="window.answer(${j})">${escape(v)}</button>`).join('')}</div>${record?`<div class="feedback ${record.selected===factor(c,step)?'good':''}"><b>${record.selected===factor(c,step)?'Correct finding.':record.locked?'Analyst debrief:':'Check the handbook and try one more time.'}</b><p>${escape(explain(c,step))}</p>${record.locked?`<p><b>Policy finding:</b> ${escape(opts[factor(c,step)])}</p>`:''}</div>`:''}`}
else choices=`<h3>Credit committee recommendation</h3>${policy}<p><b>Approval decision</b></p><div class="choices">${['APPROVE','MANUAL REVIEW','DENY'].map((v,j)=>`<button class="choice ${a.decision===j?'selected':''}" ${submitted?'disabled':''} onclick="window.pickDecision(${j})">${v}</button>`).join('')}</div><p><b>Credit limit</b></p><div class="choices">${[0,1500,3000,5000].map(v=>`<button class="choice ${a.limit===v?'selected':''}" ${submitted?'disabled':''} onclick="window.pickLimit(${v})">${v===0?'No credit line':money(v)}</button>`).join('')}</div>${submitted?`<div class="feedback good"><h3>Bank decision: ${e.decision}</h3><p><b>Credit limit:</b> ${e.limit?money(e.limit):'None issued'}</p><p>${escape(r.why)}</p><strong>File score: ${r.points}/6</strong></div>`:''}`;
let buttons=`<div class="btnrow"><button class="btn secondary" onclick="window.backQueue()">File queue</button>${step>0?'<button class="btn secondary" onclick="window.previousStep()">Previous</button>':''}${step<5?`<button class="btn" onclick="window.nextStep()" ${!record?.locked?'disabled':''}>${step===0?'Start review':'Continue review'}</button>`:submitted?'<button class="btn" onclick="window.backQueue()">Close file</button>':'<button class="btn" onclick="window.finalize()">Submit decision</button>'}</div>`;
app.innerHTML=`<div class="topline"><span class="eyebrow">File ${i+1} of 8 · ${escape(c.name)}</span><span class="pill">Step ${step+1} of 6</span></div><div class="track"><div style="width:${(step+1)/6*100}%"></div></div><div class="card"><h2>${titles[step]}</h2>${info}<div class="lesson"><b>Analyst training:</b> ${escape(explain(c,step))}</div>${choices}${buttons}</div><p class="note">Fictional cases and underwriting rules. Student results submit to the established PFM completion endpoint.</p>`;
}
function metric(k,v){return `<div class="metric"><small>${k}</small><strong>${v}</strong></div>`}
window.clockIn=()=>{let f=$('#first').value.trim(),l=$('#last').value.trim(),b=$('#block').value;if(!f||!l||!b){alert('Enter your first name, last name, and class block.');return}state.first=f;state.last=l;state.block=b;state.started=state.started||Date.now();state.session=state.session||'CA21-'+Date.now().toString(36);state.screen='queue';render()};
window.openCase=i=>{if(!state.first||i>Object.keys(state.results).length)return;state.caseIndex=i;state.step=state.results[i]?5:0;state.screen='file';render()};
window.backQueue=()=>{state.screen='queue';render()};
window.previousStep=()=>{state.step=Math.max(0,state.step-1);render()};
window.answer=j=>{let i=state.caseIndex,s=state.step; if(state.results[i])return;let a=state.answers[i]??={},key='s'+s,old=a[key];if(old?.locked)return;let good=j===factor(cases[i],s);a[key]={selected:j,tries:(old?.tries||0)+1,locked:good||(old?.tries||0)>=1,points:good?old?0.5:1:0};render()};
window.nextStep=()=>{let a=state.answers[state.caseIndex]||{};if(!a['s'+state.step]?.locked)return;state.step++;render()};
window.pickDecision=j=>{let a=state.answers[state.caseIndex]??={};a.decision=j;render()};
window.pickLimit=v=>{let a=state.answers[state.caseIndex]??={};a.limit=v;render()};
window.finalize=()=>{let i=state.caseIndex,c=cases[i],a=state.answers[i]||{},e=expected(c);if(a.decision===undefined||a.limit===undefined){alert('Choose the decision and credit limit.');return}let points=[0,1,2,3,4].reduce((n,s)=>n+(a['s'+s]?.points||0),0);if(a.decision===['APPROVE','MANUAL REVIEW','DENY'].indexOf(e.decision)&&a.limit===e.limit)points+=1;let why=e.decision==='APPROVE'?'Every policy check passed. Use the credit-score tier to determine the maximum training limit.':e.decision==='DENY'?'One or more mandatory denial thresholds were triggered. A good income or score cannot override these fictional bank rules.':'One or more factors require further investigation before approval.';state.results[i]={points,why,decision:a.decision,limit:a.limit};render()};
window.showReport=()=>{if(Object.keys(state.results).length!==8)return;state.screen='report';render();if(!state.submitted)window.submitSheet()};
window.submitSheet=async()=>{if(state.submitted||state.sending||Object.keys(state.results).length!==8)return;state.sending=true;state.status='Submitting to Google Sheets…';render();let score=Object.values(state.results).reduce((s,x)=>s+x.points,0),mins=Math.max(1,Math.round((Date.now()-state.started)/60000)),name=state.first+' '+state.last;let record={moduleId:'pfm-module-21-credit-analyst',moduleTitle:'Personal Finance Module 21 - Credit Analyst Academy',category:'Personal Finance',topic:'Credit Application Analysis and Underwriting',productType:'Interactive Module',moduleSize:'extended',score,totalQuestions:48,percent:Math.round(score/48*100)+'%',completed:'Yes',answers:JSON.stringify({files:cases.map((c,i)=>({applicant:c.name,answers:state.answers[i],result:state.results[i]}))}),timeMinutes:mins,reflection:'',sessionId:state.session,studentName:name,firstName:state.first,lastName:state.last,classPeriod:state.block,assessmentType:'credit analyst simulation',version:'2.0-pfm-m21'};let body=new URLSearchParams({action:'moduleSubmit',manualEntry:'1',moduleNumber:'21',bellId:'PFM-MODULE-21-CREDIT-ANALYST',label:record.moduleTitle,firstName:state.first,lastName:state.last,name,answer:JSON.stringify(record),late:'0',duration:String(mins),timestamp:new Date().toISOString(),cls:'Personal Finance',googleName:'Manual entry',schoolEmail:'',block:state.block});try{let response=await fetch(sheet,{method:'POST',body}),data=await response.json();if(!data.success&&data.error!=='This completion was already submitted.')throw Error(data.error||'Not confirmed');state.submitted=true;state.status='Google Sheets confirmed your submission.'}catch(e){state.status='Submission not confirmed. Retry while connected or tell Mr. D.';console.error(e)}finally{state.sending=false;render()}};
render();
})();</script></body></html>
