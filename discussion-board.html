<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Discussion | Mr. D's HQ</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#F6F1E8;--card:#FFFDF8;--text:#172033;--muted:#626977;--blue:#2F6FB5;--teal:#18776F;--line:rgba(23,32,51,.14)}*{box-sizing:border-box}body{margin:0;font-family:Poppins,sans-serif;color:var(--text);background:linear-gradient(145deg,#FBF8F2,var(--bg));min-height:100vh}.shell{width:min(900px,calc(100% - 28px));margin:auto}.top{padding:38px 0 18px}.back{color:var(--blue);font-weight:700;text-decoration:none}.eyebrow{margin-top:28px;color:var(--teal);font-size:.76rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase}h1{font-size:clamp(2rem,6vw,3.5rem);margin:8px 0 8px;letter-spacing:-.05em}.lead{color:var(--muted);line-height:1.6}.panel,.post{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;margin:18px 0;box-shadow:0 12px 35px rgba(63,48,33,.07)}.prompt{font-size:1.15rem;font-weight:700;line-height:1.55}.followup{margin-top:14px;padding:14px 16px;border-radius:14px;background:#F3F7FB;border-left:4px solid var(--blue);line-height:1.55}.followup strong{display:block;margin-bottom:4px}.fields{display:grid;grid-template-columns:1fr 1fr 120px;gap:10px;margin-top:18px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:white}textarea{min-height:125px;resize:vertical;margin-top:10px}button{border:0;border-radius:999px;padding:11px 16px;background:var(--blue);color:white;font-weight:700;cursor:pointer}.choice{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.choice label{border:1px solid var(--line);border-radius:999px;padding:9px 12px;background:white}.meta{color:var(--muted);font-size:.78rem;margin-bottom:8px}.stance{font-weight:800;color:var(--teal);font-size:.84rem}.body{line-height:1.6;margin:10px 0}.actions{display:flex;gap:10px;align-items:center}.actions button{background:white;color:var(--text);border:1px solid var(--line);padding:7px 11px}.reply{margin:12px 0 0 26px;border-left:3px solid rgba(47,111,181,.2);padding:10px 14px;background:#FBF8F2;border-radius:0 12px 12px 0}.replybox{display:none;margin-top:10px}.empty{text-align:center;color:var(--muted);padding:30px}.status{font-size:.84rem;color:var(--teal);margin-top:10px}.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}.filters select{width:auto}@media(max-width:650px){.fields{grid-template-columns:1fr}.reply{margin-left:10px}}</style></head><body><main class="shell"><div class="top"><a class="back" id="back" href="/">← Back to class</a><div class="eyebrow" id="eyebrow">Post-Module Discussion</div><h1 id="title">Class Discussion</h1><p class="lead">Post your thinking, read your classmates' ideas, and respond respectfully. Your first name and last initial are public; your full name is kept with the teacher record.</p></div><section class="panel"><div class="prompt" id="prompt"></div><div class="choice" id="choice"></div><div class="followup" id="followup" style="display:none"></div><div class="fields"><input id="first" placeholder="First name"><input id="last" placeholder="Last name"><select id="block"><option value="">Block</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></div><textarea id="response" placeholder="Use a real example and explain your reasoning..."></textarea><button onclick="postResponse()">Post Response</button><div class="status" id="postStatus"></div></section><div class="filters"><strong>Class discussion</strong><select id="blockFilter" onchange="loadPosts()"><option value="">All blocks</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select><button onclick="loadPosts()">Refresh</button></div><section id="feed"><div class="empty">Loading responses…</div></section></main><script>
const API='https://script.google.com/macros/s/AKfycbyucfQcDDR9S_4i8_EiI2LAm0k49NNGT0IBiRnXTjZQKgtfuOwM73Wtxxt5fzojGFY/exec';
const qs=new URLSearchParams(location.search);const CLS=qs.get('class')||'Marketing';const DISCUSSION=qs.get('discussion')||'default';
const configs={
'Marketing:default':{eyebrow:'Post-Module Discussion',prompt:'Think of something you recently bought, wanted, downloaded, watched, or asked for. Did marketing create the want — or did it mostly help you discover or choose it? Use a real example.',choices:[['A','A — Marketing mostly helps us discover or choose things'],['B','B — Marketing can create wants we did not have before']]},
'Marketing:data':{eyebrow:'Discussion 2 • Emotional Targeting',prompt:'Imagine an app can tell from your searches, scrolling, messages, music, or late-night activity that you are feeling sad, lonely, insecure, stressed, or recently went through a breakup. Should marketers be allowed to use that information to target you with ads at that exact moment?',choices:[['A','A — Yes. If the data predicts what someone needs or wants, personalized advertising is fair game.'],['B','B — No. Targeting people when they are emotionally vulnerable crosses an ethical line.']],followup:'FOLLOW-UP: A company discovers that people who feel insecure are much more likely to buy beauty products, supplements, dating subscriptions, or expensive “self-improvement” services. If the ads work and increase sales, is that smart marketing or exploitation? What should be off-limits — if anything?'},
'AP Business:default':{eyebrow:'Post-Module Discussion',prompt:'Think of a business decision you have seen a company make recently. Who benefited most — the customer, employees, owners, or another stakeholder? Was it a good business decision? Defend your answer.',choices:[['Position stated','I have taken a clear position in my response']]},
'Business 101:default':{eyebrow:'Class Discussion',prompt:'What matters more for a successful business: having a great product or making great business decisions? Pick a side and use a real company or product as evidence.',choices:[['Position stated','I have taken a clear position in my response']]},
'Personal Finance:default':{eyebrow:'Class Discussion',prompt:'Which has a bigger effect on your financial future: how much money you earn or the decisions you make with the money you have? Pick a side and explain with a realistic example.',choices:[['Position stated','I have taken a clear position in my response']]}
};
const cfg=configs[CLS+':'+DISCUSSION]||configs[CLS+':default']||configs['Marketing:default'];const slugs={'Marketing':'/marketing/','AP Business':'/ap-business/','Business 101':'/business-101/','Personal Finance':'/pfm/'};document.getElementById('title').textContent=CLS+' Discussion';document.getElementById('prompt').textContent=cfg.prompt;document.getElementById('eyebrow').textContent=cfg.eyebrow;document.getElementById('back').href=slugs[CLS]||'/';document.getElementById('choice').innerHTML=cfg.choices.map(c=>`<label><input type="radio" name="stance" value="${escAttr(c[0])}"> ${esc(c[1])}</label>`).join('');if(cfg.followup){document.getElementById('followup').style.display='block';document.getElementById('followup').innerHTML='<strong>Push your thinking further:</strong>'+esc(cfg.followup.replace('FOLLOW-UP: ',''))}
function enc(o){return Object.entries(o).map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v??'')).join('&')}function escAttr(s){return String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function api(params){const r=await fetch(API+'?'+enc(params),{cache:'no-store'});const text=await r.text();let d;try{d=JSON.parse(text)}catch(e){throw new Error('Apps Script returned a non-JSON response. Check deployment access/version.')}if(!d.success&&d.error)throw new Error(d.error);return d}
async function postResponse(){const s=document.getElementById('postStatus');const first=document.getElementById('first').value.trim(),last=document.getElementById('last').value.trim(),block=document.getElementById('block').value,response=document.getElementById('response').value.trim(),stance=document.querySelector('input[name=stance]:checked')?.value||'';if(!first||!last||!block||!response||!stance){s.textContent='Complete your name, block, position, and response first.';return}s.textContent='Posting…';try{await api({action:'discussionPost',className:CLS,firstName:first,lastName:last,block,stance,response,prompt:cfg.prompt+(cfg.followup?' | '+cfg.followup:'')});document.getElementById('response').value='';s.textContent='Posted successfully.';loadPosts()}catch(e){s.textContent='Could not post: '+e.message}}
async function loadPosts(){const feed=document.getElementById('feed'),block=document.getElementById('blockFilter').value;try{const d=await api({action:'discussionList',className:CLS,block});const key=cfg.prompt+(cfg.followup?' | '+cfg.followup:'');const posts=(d.posts||[]).filter(p=>!p.prompt||p.prompt===key);feed.innerHTML=posts.length?posts.map(renderPost).join(''):'<div class="empty">No responses yet. Be the first to post.</div>'}catch(e){feed.innerHTML='<div class="empty">Discussion connection error: '+esc(e.message)+'</div>'}}
function renderPost(p){return `<article class="post"><div class="meta">${esc(p.displayName)} · Block ${esc(p.block)} · ${esc(p.time)}</div><div class="stance">${esc(p.stance)}</div><div class="body">${esc(p.response)}</div><div class="actions"><button onclick="agree('${esc(p.id)}')">Agree · ${Number(p.agrees||0)}</button><button onclick="toggleReply('${esc(p.id)}')">Reply</button></div><div class="replybox" id="rb-${esc(p.id)}"><div class="fields"><input id="rf-${esc(p.id)}" placeholder="First name"><input id="rl-${esc(p.id)}" placeholder="Last name"><select id="rbl-${esc(p.id)}"><option value="">Block</option>${[1,2,3,4,5,6,7,8].map(x=>`<option>${x}</option>`).join('')}</select></div><textarea id="rt-${esc(p.id)}" placeholder="Write a respectful reply..."></textarea><button onclick="reply('${esc(p.id)}')">Post Reply</button></div>${(p.replies||[]).map(r=>`<div class="reply"><div class="meta">${esc(r.displayName)} · Block ${esc(r.block)}</div><div>${esc(r.response)}</div></div>`).join('')}</article>`}
function toggleReply(id){const x=document.getElementById('rb-'+id);x.style.display=x.style.display==='block'?'none':'block'}async function agree(id){try{await api({action:'discussionAgree',className:CLS,id});loadPosts()}catch(e){alert('Could not record agree: '+e.message)}}async function reply(id){const first=document.getElementById('rf-'+id).value.trim(),last=document.getElementById('rl-'+id).value.trim(),block=document.getElementById('rbl-'+id).value,response=document.getElementById('rt-'+id).value.trim();if(!first||!last||!block||!response)return;try{await api({action:'discussionReply',className:CLS,parentId:id,firstName:first,lastName:last,block,response});loadPosts()}catch(e){alert('Could not post reply: '+e.message)}}loadPosts();</script></body></html>
