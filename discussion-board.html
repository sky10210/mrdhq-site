<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Discussion | Mr. D's HQ</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--bg:#F6F1E8;--card:#FFFDF8;--text:#172033;--muted:#626977;--blue:#2F6FB5;--teal:#18776F;--line:rgba(23,32,51,.14)}*{box-sizing:border-box}body{margin:0;font-family:Poppins,sans-serif;color:var(--text);background:linear-gradient(145deg,#FBF8F2,var(--bg));min-height:100vh}.shell{width:min(900px,calc(100% - 28px));margin:auto}.top{padding:38px 0 18px}.back{color:var(--blue);font-weight:700;text-decoration:none}.eyebrow{margin-top:28px;color:var(--teal);font-size:.76rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase}h1{font-size:clamp(2rem,6vw,3.5rem);margin:8px 0}.lead{color:var(--muted);line-height:1.6}.panel,.post{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;margin:18px 0}.prompt{font-size:1.05rem;font-weight:600;line-height:1.72;white-space:pre-line}.followup{margin-top:14px;padding:14px 16px;border-radius:14px;background:#F3F7FB;border-left:4px solid var(--blue);line-height:1.55}.fields{display:grid;grid-template-columns:1fr 1fr 120px;gap:10px;margin-top:18px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:white}textarea{min-height:125px;resize:vertical;margin-top:10px}button{border:0;border-radius:999px;padding:11px 16px;background:var(--blue);color:white;font-weight:700;cursor:pointer}.choice{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.choice label{border:1px solid var(--line);border-radius:16px;padding:11px 13px;background:white;flex:1 1 320px}.meta{color:var(--muted);font-size:.78rem;margin-bottom:8px}.stance{font-weight:800;color:var(--teal);font-size:.84rem}.body{line-height:1.6;margin:10px 0}.actions{display:flex;gap:10px}.actions button{background:white;color:var(--text);border:1px solid var(--line);padding:7px 11px}.reply{margin:12px 0 0 26px;border-left:3px solid rgba(47,111,181,.2);padding:10px 14px;background:#FBF8F2}.replybox{display:none;margin-top:10px}.empty{text-align:center;color:var(--muted);padding:30px}.status{font-size:.84rem;color:var(--teal);margin-top:10px}.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}.filters select{width:auto}@media(max-width:650px){.fields{grid-template-columns:1fr}}</style></head><body><main class="shell"><div class="top"><a class="back" id="back" href="/">← Back</a><div class="eyebrow" id="eyebrow"></div><h1 id="title">Class Discussion</h1><p class="lead">Post your thinking, read your classmates' ideas, and respond respectfully. Each discussion keeps its own response feed.</p></div><section class="panel"><div class="prompt" id="prompt"></div><div class="choice" id="choice"></div><div class="followup" id="followup" style="display:none"></div><div class="fields"><input id="first" placeholder="First name"><input id="last" placeholder="Last name"><select id="block"></select></div><textarea id="response" placeholder="Take a position and explain your reasoning..."></textarea><button onclick="postResponse()">Post Response</button><div class="status" id="postStatus"></div></section><div class="filters"><strong>Class discussion</strong><select id="blockFilter" onchange="loadPosts()"></select><button onclick="loadPosts()">Refresh</button></div><section id="feed"><div class="empty">Loading responses…</div></section></main><script>
const API='https://script.google.com/macros/s/AKfycbyucfQcDDR9S_4i8_EiI2LAm0k49NNGT0IBiRnXTjZQKgtfuOwM73Wtxxt5fzojGFY/exec';
const qs=new URLSearchParams(location.search),CLS=qs.get('class')||'Marketing',DISCUSSION=qs.get('discussion')||'default';
const metaCfg={eyebrow:'Current Event • The Meta Case',prompt:'THE META CASE — WHO IS RESPONSIBLE?\n\nMeta, the company behind Instagram and Facebook, reached settlements with U.S. states after allegations that its platforms were designed to keep young users engaged. Meta denies wrongdoing.\n\nYOUR TAKE: Who should be MOST responsible for how much time teens spend on social media?',choices:[['Apps','The apps / platforms'],['User','The user'],['Parents','Parents'],['All three','All three share responsibility']],followup:'Use at least one fact from the case. Then explain one realistic rule or design change you think would actually help.'};
const configs={
'Marketing:default':{eyebrow:'Discussion 1 • Marketing & Wants',prompt:'Think of something you recently bought, wanted, downloaded, watched, or asked for. Did marketing create the want — or did it mostly help you discover or choose it? Use a real example.',choices:[['A','A — Marketing mostly helps us discover or choose things'],['B','B — Marketing can create wants we did not have before']]},
'Marketing:data':{eyebrow:"Discussion 2 • The App Knows You're Sad",prompt:"THE APP KNOWS YOU'RE SAD\n\nA social media app notices that a user has been watching breakup videos, searching things like “how to get over someone,” staying online much later than usual, replaying sad music, and interacting with posts about loneliness. The user never directly tells the app they are sad, but the platform predicts that the person may be emotionally vulnerable.\n\nThat prediction can be valuable to marketers because ads can be changed to match the emotion the system thinks the user is experiencing.\n\nDEBATE: Should a platform be allowed to use a prediction about someone's emotional vulnerability to decide which ads they see?",choices:[['A','A — YES. It is personalization and the customer still chooses.'],['B','B — NO. Using emotional vulnerability as a sales opportunity crosses an ethical line.']],followup:'If an ad genuinely helps someone, does that make the targeting ethical? Where would you draw the line?'},
'Marketing:inferred':{eyebrow:'Discussion 3 • You Never Told Them',prompt:"YOU NEVER TOLD THEM\n\nA student never tells an app that they feel insecure about their appearance. The platform tracks viewing, searches, follows, pauses and clicks, then predicts insecurity and begins serving more appearance-related ads.\n\nDEBATE: Is it acceptable for marketers to target a personal insecurity that a customer never actually disclosed?",choices:[['A','A — YES. Behavior is useful customer data and relevant ads can help.'],['B','B — NO. Inferring a private insecurity and monetizing it is too invasive.']],followup:'Does it matter whether the algorithm is correct? What if the prediction is wrong and makes someone feel worse?'},
'Marketing:worstweek':{eyebrow:'Discussion 4 • Your Worst Week',prompt:"YOUR WORST WEEK IS THEIR BEST SALES OPPORTUNITY\n\nA company finds that impulse purchases rise after breakups, during financial stress, during loneliness late at night, and after upsetting content. The marketing team proposes increasing ad frequency and urgency during those moments.\n\nDEBATE: Is it ethical to intentionally advertise more aggressively during moments when customers are more emotionally vulnerable?",choices:[['A','A — YES. Timing ads for when customers are most likely to buy is normal marketing.'],['B','B — NO. Designing campaigns around vulnerable moments is exploitation.']],followup:'Would your answer change depending on whether the product is harmless, expensive, addictive, or risky?'},
'Marketing:private':{eyebrow:'Discussion 5 • Before Your Friends Know',prompt:"THE ALGORITHM KNOWS BEFORE YOUR FRIENDS DO\n\nAdvertising platforms can combine searches, locations, purchases, viewing habits and changes in behavior to predict private life events such as breakups, money trouble, moving or health concerns.\n\nDEBATE: Should companies ever be allowed to target ads based on predictions about someone's private life that the person never intentionally shared?",choices:[['A','A — YES. If the data is legal, relevant advertising can be useful.'],['B','B — NO. Some parts of a person’s life should never become advertising categories.']],followup:'Which areas, if any, should be completely off-limits to marketers? Defend your boundary.'},
'Marketing:works':{eyebrow:'Discussion 6 • If It Works, Is It Wrong?',prompt:"IF IT WORKS, IS IT WRONG?\n\nA marketing team tests ordinary targeting against AI targeting that changes messages based on predicted loneliness, anxiety, insecurity or stress. The emotional campaign performs dramatically better, the products are legal, and the ads are truthful.\n\nDEBATE: Should the company use the emotionally targeted campaign because it works better?",choices:[['A','A — YES. Effective persuasion is the point of marketing if claims are truthful and customers choose.'],['B','B — NO. There should be ethical limits on persuasion even when it is legal and effective.']],followup:'Should marketers be judged mainly by results, customer choice, or the methods used to influence that choice?'},
'AP Business:default':{eyebrow:'AP Business Discussion',prompt:'Think of a business decision you have seen a company make recently. Who benefited most — customers, employees, owners, or another stakeholder? Was it a good business decision? Defend your answer.',choices:[['Position stated','I have taken a clear position']]},
'Business 101:default':{eyebrow:'Business 101 Discussion',prompt:'What matters more for a successful business: having a great product or making great business decisions? Pick a side and use a real example.',choices:[['Position stated','I have taken a clear position']]},
'Personal Finance:default':{eyebrow:'Personal Finance Discussion',prompt:'Which has a bigger effect on your financial future: how much money you earn or the decisions you make with the money you have? Pick a side and explain with a realistic example.',choices:[['Position stated','I have taken a clear position']]}
};
let cfg=DISCUSSION==='current-meta-2026-08-26'?metaCfg:(configs[CLS+':'+DISCUSSION]||configs[CLS+':default']||configs['Marketing:default']);
const homes={'Marketing':'/marketing/','AP Business':'/ap-business/','Business 101':'/business-101/','Personal Finance':'/pfm/'};
const blocks=CLS==='Personal Finance'?[1,2,4]:[1,2,3,4,5,6,7,8];
function blockOptions(all=false){return (all?'<option value="">All blocks</option>':'<option value="">Block</option>')+blocks.map(x=>`<option>${x}</option>`).join('')}
document.getElementById('block').innerHTML=blockOptions(false);document.getElementById('blockFilter').innerHTML=blockOptions(true);
document.getElementById('title').textContent=DISCUSSION.startsWith('current-')?'Current Event Discussion':CLS+' Discussion';document.getElementById('prompt').textContent=cfg.prompt;document.getElementById('eyebrow').textContent=cfg.eyebrow;document.getElementById('back').href=DISCUSSION.startsWith('current-')?'/current-events/?class='+encodeURIComponent(CLS):(homes[CLS]||'/');document.getElementById('choice').innerHTML=cfg.choices.map(c=>`<label><input type="radio" name="stance" value="${escAttr(c[0])}"> ${esc(c[1])}</label>`).join('');if(cfg.followup){document.getElementById('followup').style.display='block';document.getElementById('followup').innerHTML='<strong>Push your thinking further:</strong> '+esc(cfg.followup)}
function enc(o){return Object.entries(o).map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v??'')).join('&')}function escAttr(s){return String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function api(params){const r=await fetch(API+'?'+enc(params),{cache:'no-store'});const text=await r.text();let d;try{d=JSON.parse(text)}catch(e){throw new Error('Apps Script returned a non-JSON response.')}if(!d.success&&d.error)throw new Error(d.error);return d}
async function postResponse(){const s=document.getElementById('postStatus'),first=document.getElementById('first').value.trim(),last=document.getElementById('last').value.trim(),block=document.getElementById('block').value,response=document.getElementById('response').value.trim(),stance=document.querySelector('input[name=stance]:checked')?.value||'';if(!first||!last||!block||!response||!stance){s.textContent='Complete your name, block, position, and response first.';return}s.textContent='Posting…';try{await api({action:'discussionPost',className:CLS,discussionId:DISCUSSION,firstName:first,lastName:last,block,stance,response,prompt:cfg.prompt+(cfg.followup?' | '+cfg.followup:'')});document.getElementById('response').value='';s.textContent='Posted successfully.';loadPosts()}catch(e){s.textContent='Could not post: '+e.message}}
async function loadPosts(){const feed=document.getElementById('feed'),block=document.getElementById('blockFilter').value;try{const key=cfg.prompt+(cfg.followup?' | '+cfg.followup:'');const d=await api({action:'discussionList',className:CLS,block,discussionId:DISCUSSION,prompt:key});const posts=(d.posts||[]).filter(p=>p.discussionId?p.discussionId===DISCUSSION:p.prompt===key);feed.innerHTML=posts.length?posts.map(renderPost).join(''):'<div class="empty">No responses yet. Be the first to post.</div>'}catch(e){feed.innerHTML='<div class="empty">Discussion connection error: '+esc(e.message)+'</div>'}}
function renderPost(p){return `<article class="post"><div class="meta">${esc(p.displayName)} · Block ${esc(p.block)} · ${esc(p.time)}</div><div class="stance">${esc(p.stance)}</div><div class="body">${esc(p.response)}</div><div class="actions"><button onclick="agree('${esc(p.id)}')">Agree · ${Number(p.agrees||0)}</button><button onclick="toggleReply('${esc(p.id)}')">Reply</button></div><div class="replybox" id="rb-${esc(p.id)}"><div class="fields"><input id="rf-${esc(p.id)}" placeholder="First name"><input id="rl-${esc(p.id)}" placeholder="Last name"><select id="rbl-${esc(p.id)}">${blockOptions(false)}</select></div><textarea id="rt-${esc(p.id)}" placeholder="Write a respectful reply..."></textarea><button onclick="reply('${esc(p.id)}')">Post Reply</button></div>${(p.replies||[]).map(r=>`<div class="reply"><div class="meta">${esc(r.displayName)} · Block ${esc(r.block)}</div><div>${esc(r.response)}</div></div>`).join('')}</article>`}function toggleReply(id){const x=document.getElementById('rb-'+id);x.style.display=x.style.display==='block'?'none':'block'}async function agree(id){try{await api({action:'discussionAgree',className:CLS,id});loadPosts()}catch(e){alert(e.message)}}async function reply(id){const first=document.getElementById('rf-'+id).value.trim(),last=document.getElementById('rl-'+id).value.trim(),block=document.getElementById('rbl-'+id).value,response=document.getElementById('rt-'+id).value.trim();if(!first||!last||!block||!response)return;try{await api({action:'discussionReply',className:CLS,parentId:id,firstName:first,lastName:last,block,response});loadPosts()}catch(e){alert(e.message)}}loadPosts();</script></body></html>
