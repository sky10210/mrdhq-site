name: Populate Opening Bell Questions

on:
  push:
    paths:
      - '.github/workflows/populate-opening-bell-questions.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore prior Opening Bell hub and populate questions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          # Restore the original Opening Bell hub from before the simplified replacement.
          old = subprocess.check_output([
              'git','show','8bb7c9d9c557220c87a43c2d7ffd4e1fc178aea5:opening-bell/index.html'
          ], text=True)
          Path('opening-bell/index.html').write_text(old)

          general = [
            'A company can legally raise a price during a shortage. Should it? Why or why not?',
            'You own a restaurant and discover your most popular item barely makes money. What do you do?',
            'A competitor accidentally emails you its pricing strategy. Do you use it?',
            'Would you rather launch a great product with weak marketing or an average product with great marketing? Defend your choice.',
            'An employee is your best salesperson but is consistently rude to coworkers. Keep them, warn them, or fire them? Why?',
            'A business can save 25% by moving production overseas, but local jobs will be lost. What should it do?',
            'Should companies be allowed to use customer data to personalize prices? Why or why not?',
            'A small business gets one viral video and demand triples overnight. What should the owner do first?',
            'Would you buy from a company you knew treated employees poorly if its product was much cheaper? Why?',
            'A new business has $5,000 left. Spend it on advertising, product improvement, or cash reserves? Defend one.',
            'Is it ethical for an influencer to promote a product they do not personally use if they disclose the sponsorship?',
            'Your business made a mistake that customers have not noticed. Do you tell them? Explain.',
            'What matters more for a new business: being first or being better?',
            'A company can replace several jobs with AI and lower prices. Should it? What should management consider?',
            'Should a business refuse a profitable customer if that customer conflicts with the company’s values?'
          ]

          pf = [
            'You have two job offers: Job A pays $18 an hour but you do not really like the work. Job B pays $15 an hour doing something you would actually enjoy. Which job are you taking, and why?',
            'Your friend says, “I deserve $25 an hour because I work hard.” Should pay be based mostly on effort, skill, experience, demand, or something else? Defend your answer.',
            'You work enough hours to earn $600, but only $492 hits your bank account. What is your first reaction? Is it fair that you do not receive the entire $600? Why or why not?',
            'Imagine you could choose: pay more in taxes and receive more public services, or pay less in taxes and pay for more things yourself. Which would you choose? Why?',
            'The government gives YOU control of $100 in tax money. Divide it between schools, roads, police and fire, military, healthcare, parks, and assistance programs. Where does your $100 go?',
            'Money is taken from your paycheck today to help fund benefits for retirees and other eligible people. Is that a fair system, or should everyone be responsible for saving entirely for themselves? Explain.',
            'You receive a $1,200 tax refund. Your friend says, “That is awesome—the government gave you $1,200!” Do you agree? What would you do with the money?',
            'Would you rather have more money in every paycheck and risk owing at tax time, or have more withheld and potentially receive a refund? Why?',
            'You make $8,000 from a side hustle on top of your regular job. Should side-hustle income be taxed the same way as money from a traditional job? Why or why not?',
            'Two people work 40 hours per week. One earns $30,000 per year and one earns $300,000 per year. Should they pay the same percentage of income in taxes, different percentages, or the same dollar amount? Explain your system.',
            'Should schools require a personal finance course to graduate? What should every student learn?',
            'If you could know only one number about your finances each month, what would it be?',
            'Would you lend money to a family member if you suspected they could not repay it? Why or why not?',
            'Is a college degree worth going into debt for? What factors determine the answer?',
            'Which is more dangerous: having no savings or having high-interest debt? Defend your answer.'
          ]

          def jsq(s):
              return s.replace('\\','\\\\').replace('"','\\"').replace('\n',' ')

          def populate(path, questions):
              p=Path(path)
              text=p.read_text()
              for i,q in enumerate(questions,1):
                  pattern = rf'(\{{id:{i},label:"Opening Bell {i}",status:"[^"]+",question:)"[^"]*"(,hint:"[^"]*"\}})'
                  repl = rf'\1"{jsq(q)}"\2'
                  text,n = re.subn(pattern,repl,text,count=1)
                  if n != 1:
                      raise SystemExit(f'Could not update {path} bell {i}')
              p.write_text(text)

          for f in ['opening-bell/ap-business.html','opening-bell/marketing.html','opening-bell/business-101.html']:
              populate(f,general)
          populate('opening-bell/pfm.html',pf)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add opening-bell/index.html opening-bell/ap-business.html opening-bell/marketing.html opening-bell/business-101.html opening-bell/pfm.html
          if ! git diff --cached --quiet; then
            git commit -m 'Restore Opening Bell hub and add question banks'
            git push
          fi
