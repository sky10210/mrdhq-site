name: Patch Canvas teacher review

on:
  push:
    paths:
      - '.github/workflows/patch-canvas-teacher-review.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire teacher review script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ap-business/business-canvas/index.html')
          s = p.read_text()
          if '<script src="teacher-review.js"></script>' not in s:
              s = s.replace('<script src="teacher-progress.js"></script>', '<script src="teacher-progress.js"></script>\n<script src="teacher-review.js"></script>')
              p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ap-business/business-canvas/index.html
          git commit -m "Show Canvas student writing in teacher dashboard [skip ci]" || exit 0
          git push
