name: Add Opening Bell Teacher Question Preview

on:
  push:
    paths:
      - '.github/workflows/add-opening-bell-teacher-question-preview.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add question preview to teacher panels
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('opening-bell/ap-business.html'),
              Path('opening-bell/marketing.html'),
              Path('opening-bell/business-101.html'),
              Path('opening-bell/pfm.html'),
          ]

          old_select = '<div class="m-field"><label>Select Opening Bell</label><select id="tp-sel"></select></div>'
          new_select = '''<div class="m-field"><label>Select Opening Bell</label><select id="tp-sel"></select></div>\n          <div class="m-field">\n            <label>Question Preview</label>\n            <div id="tp-q-preview" style="background:var(--bg4);border:1px solid var(--border2);border-left:3px solid var(--red);border-radius:6px;padding:11px 13px;font-size:12px;font-weight:500;line-height:1.55;color:var(--text);min-height:54px">Select an Opening Bell to preview its question.</div>\n          </div>'''

          marker = 'function ringBell(){'
          preview_fn = '''function updateTeacherQuestionPreview(){\n  const sel=document.getElementById('tp-sel');\n  const box=document.getElementById('tp-q-preview');\n  if(!sel||!box)return;\n  const id=parseInt(sel.value);\n  const b=CFG.BELLS.find(x=>x.id===id);\n  box.textContent=b&&b.question?b.question:'Question not yet set.';\n}\n\n'''

          for path in files:
              text = path.read_text(encoding='utf-8')
              if 'id="tp-q-preview"' not in text:
                  if old_select not in text:
                      raise SystemExit(f'Select marker missing in {path}')
                  text = text.replace(old_select, new_select, 1)

              if 'function updateTeacherQuestionPreview()' not in text:
                  if marker not in text:
                      raise SystemExit(f'ringBell marker missing in {path}')
                  text = text.replace(marker, preview_fn + marker, 1)

              old_tail = "    sel.appendChild(o);\n  });\n}"
              new_tail = "    sel.appendChild(o);\n  });\n\n  sel.onchange=updateTeacherQuestionPreview;\n  updateTeacherQuestionPreview();\n}"
              if 'sel.onchange=updateTeacherQuestionPreview' not in text:
                  if old_tail not in text:
                      raise SystemExit(f'populateSel tail missing in {path}')
                  text = text.replace(old_tail, new_tail, 1)

              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opening-bell/ap-business.html opening-bell/marketing.html opening-bell/business-101.html opening-bell/pfm.html
          git diff --cached --quiet || git commit -m "Show selected question in Opening Bell teacher panel"
          git push
