name: Apply Beige Theme

on:
  push:
    paths:
      - '.github/workflows/apply-beige-theme.yml'

permissions:
  contents: write

jobs:
  apply-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply shared beige overrides
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          targets = [
              Path('ap-business/index.html'),
              Path('marketing/index.html'),
              Path('pfm/index.html'),
              Path('business-101/index.html'),
              Path('opening-bell/index.html'),
              Path('opening-bell/ap-business.html'),
              Path('opening-bell/marketing.html'),
              Path('opening-bell/pfm.html'),
              Path('opening-bell/business-101.html'),
              Path('student-tools.html'),
              Path('business-dashboard.html'),
          ]

          css = r'''

    /* MRDHQ LIGHT BEIGE THEME — shared visual override */
    :root {
      --bg: #F6F1E8 !important;
      --bg-deep: #EFE6D8 !important;
      --card: rgba(255,253,248,.90) !important;
      --card-strong: #FFFDF8 !important;
      --surface: rgba(255,253,248,.90) !important;
      --surface-strong: #FFFDF8 !important;
      --text: #172033 !important;
      --muted: #5E6470 !important;
      --soft: #7A7F88 !important;
      --accent: #2F6FB5 !important;
      --accent-hover: #4E86C5 !important;
      --teal: #18776F !important;
      --teal-bright: #248D82 !important;
      --line: rgba(23,32,51,.12) !important;
      --line-gold: rgba(179,132,72,.28) !important;
      --shadow: 0 18px 50px rgba(63,48,33,.10) !important;
    }

    html { background: #F6F1E8 !important; }
    body {
      color: #172033 !important;
      background:
        radial-gradient(circle at 50% -10%, rgba(75,134,197,.12), transparent 34rem),
        radial-gradient(circle at 88% 8%, rgba(36,141,130,.09), transparent 30rem),
        linear-gradient(145deg, #FBF8F2 0%, #F6F1E8 52%, #EFE6D8 100%) !important;
    }
    body::before {
      background-image:
        linear-gradient(rgba(23,32,51,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23,32,51,.025) 1px, transparent 1px) !important;
      opacity: .7;
    }

    .topbar, header.topbar, nav.topbar {
      background: rgba(250,247,240,.90) !important;
      border-color: rgba(23,32,51,.12) !important;
      box-shadow: 0 10px 30px rgba(63,48,33,.06) !important;
    }

    .navlinks a, .nav a, .brand, .brand-text, h1, h2, h3, h4, h5, h6 {
      color: #172033;
    }
    .navlinks a:hover {
      color: #172033 !important;
      background: rgba(47,111,181,.08) !important;
    }
    .brand-text span, .district-line { color: #248D82 !important; }

    .gradient-text {
      background: linear-gradient(135deg, #172033 12%, #2F6FB5 62%, #4E86C5) !important;
      -webkit-background-clip: text !important;
      background-clip: text !important;
      color: transparent !important;
    }

    .quick-strip,
    .course-card,
    .spotlight-card,
    .card,
    .panel,
    .tool-card,
    .resource-card,
    .dashboard-card,
    .news-card,
    .market-card,
    .widget,
    .module-card,
    .bell-card,
    .prompt-card,
    .section-card,
    .info-card,
    .content-card,
    .modal-card {
      background: linear-gradient(180deg, rgba(255,253,248,.96), rgba(248,243,234,.94)) !important;
      border-color: rgba(23,32,51,.12) !important;
      color: #172033 !important;
      box-shadow: 0 18px 45px rgba(63,48,33,.08) !important;
    }

    .course-card:hover,
    .tool-card:hover,
    .resource-card:hover,
    .module-card:hover,
    .bell-card:hover {
      border-color: rgba(47,111,181,.28) !important;
      box-shadow: 0 20px 48px rgba(63,48,33,.12) !important;
    }

    p, li, .caption, .tiny-note, .subtitle, .description, .meta, .small, .muted,
    .quick-item span, .course-card p, .spotlight-card p, .section-heading p {
      color: #5E6470 !important;
    }

    .tag, .pill, .chip, .badge {
      color: #172033 !important;
      background: rgba(36,141,130,.09) !important;
      border-color: rgba(24,119,111,.22) !important;
    }

    .btn-secondary, .locked, button.secondary, .secondary-btn {
      color: #172033 !important;
      background: rgba(255,253,248,.86) !important;
      border-color: rgba(23,32,51,.14) !important;
    }
    .btn-primary, button.primary, .primary-btn {
      color: #FFFFFF !important;
      background: linear-gradient(135deg, #2F6FB5, #4E86C5) !important;
      box-shadow: 0 12px 30px rgba(47,111,181,.18) !important;
    }
    .btn-bell {
      color: #3A2A12 !important;
      background: linear-gradient(135deg, #F7D889, #EDB94D) !important;
    }

    input, select, textarea {
      color: #172033 !important;
      background: #FFFDF8 !important;
      border-color: rgba(23,32,51,.16) !important;
    }
    input::placeholder, textarea::placeholder { color: #8A8F98 !important; }

    .modal {
      background: rgba(40,35,29,.36) !important;
      backdrop-filter: blur(12px) !important;
    }
    .x, .close, .close-btn {
      color: #172033 !important;
      background: rgba(255,253,248,.9) !important;
      border-color: rgba(23,32,51,.14) !important;
    }

    footer {
      color: #7A7F88 !important;
      border-color: rgba(23,32,51,.12) !important;
    }
    table, th, td { border-color: rgba(23,32,51,.12) !important; }
    th { background: rgba(239,230,216,.72) !important; color: #172033 !important; }
    td { background: rgba(255,253,248,.72) !important; color: #394150 !important; }
          '''

          marker = 'MRDHQ LIGHT BEIGE THEME — shared visual override'
          changed = []
          for path in targets:
              if not path.exists():
                  print(f'Skipping missing {path}')
                  continue
              text = path.read_text(encoding='utf-8')
              if marker in text:
                  print(f'Already themed: {path}')
                  continue
              pos = text.lower().rfind('</style>')
              if pos == -1:
                  print(f'No style block found: {path}')
                  continue
              text = text[:pos] + css + '\n  ' + text[pos:]
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))

          print('Changed files:')
          print('\n'.join(changed))
          PY

      - name: Commit beige theme
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ap-business/index.html marketing/index.html pfm/index.html business-101/index.html opening-bell/*.html student-tools.html business-dashboard.html
          git commit -m 'Use light beige theme across MRDHQ pages'
          git push origin main
