name: Stock Lab Daily Portfolio History
on:
  schedule:
    # 03:15 UTC Tue-Sat, after the Sheet's evening Eastern update.
    - cron: "15 3 * * 2-6"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stock-lab-daily-history
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STOCK_LAB_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.STOCK_LAB_FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Firestore client
        run: pip install google-cloud-firestore google-auth
      - name: Save daily portfolio values
        run: python scripts/stock_lab_daily_snapshots.py
