name: Direct PFM module link
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/direct-pfm-module.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point PFM card directly to module
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pfm/index.html')
          s=p.read_text()
          old='https://vividlessons.com/modules/pfm-financial-planning-goal-setting-mrd-live.html'
          new='https://vividlessons.com/modules/pfm-financial-planning-goal-setting-mrd.html'
          if old not in s:
              raise SystemExit('wrapper link not found')
          p.write_text(s.replace(old,new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pfm/index.html
          git rm .github/workflows/direct-pfm-module.yml
          git commit -m "Link PFM card directly to Vivid goal setting module"
          git push
