name: Add Gallery Teacher Controls
on:
  push:
    paths:
      - '.github/workflows/add-gallery-teacher-controls.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/patch_gallery_teacher.py
      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add marketing/project-gallery/index.html
          git commit -m "Add inline teacher controls to Marketing Project Gallery" || exit 0
          git push
