name: Add Gallery Teacher Controls
on:
  push:
    paths:
      - '.github/workflows/add-gallery-teacher-controls.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch gallery teacher controls
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('marketing/project-gallery/index.html')
          s=p.read_text()
          css=""".teacherbtn{margin-left:auto;background:#172033}.teacher-panel{display:none;margin:0 0 18px;padding:20px;background:#fffdf8;border:1px solid rgba(47,111,181,.25);border-radius:22px;box-shadow:var(--shadow)}.teacher-panel.show{display:block}.teacher-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.teacher-head h2{margin:0;font-size:1.15rem}.teacher-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.teacher-grid .field{margin:0}.teacher-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.check{display:flex;align-items:center;gap:8px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}.check input{width:auto}.teacher-note{font-size:.78rem;color:var(--muted);margin-top:10px}.unlockbox{width:min(420px,100%);background:var(--surface);border-radius:22px;padding:22px}.unlockbox h3{margin-top:0}.unlockbox input{width:100%;font:inherit;border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0 12px}@media(max-width:860px){.teacher-grid{grid-template-columns:1fr}.teacherbtn{margin-left:0}}"""
          marker='@media(max-width:860px){.layout{grid-template-columns:1fr}'
          if '.teacher-panel{' not in s:
              s=s.replace(marker,css+marker)
          old='<span id="voteRule" class="small"></span></div><div class="layout">'
          new='<span id="voteRule" class="small"></span><button id="teacherBtn" class="btn teacherbtn" type="button">Teacher Controls</button></div><section id="teacherPanel" class="teacher-panel"><div class="teacher-head"><h2>Teacher Controls</h2><button id="lockTeacher" class="btn secondary" type="button">Lock</button></div><div class="teacher-grid"><div class="field"><label>Project status</label><select id="tStatus"><option value="submissions">Submissions Open</option><option value="voting">Voting Open</option><option value="closed">Closed</option><option value="archived">Archived</option></select></div><div class="field"><label>Max votes per student</label><input id="tMaxVotes" type="number" min="1" max="20" value="3"></div><div class="field"><label>Block</label><input id="tBlock" placeholder="All"></div><label class="check"><input id="tComments" type="checkbox"> Comments enabled</label><label class="check"><input id="tAnonymous" type="checkbox"> Hide names</label><label class="check"><input id="tLate" type="checkbox"> Allow late submissions</label><label class="check"><input id="tLateEligible" type="checkbox"> Late entries can be voted on</label><label class="check"><input id="tResults" type="checkbox"> Reveal results + rankings</label></div><div class="teacher-actions"><button id="saveTeacher" class="btn" type="button">Save Project Settings</button><button id="refreshTeacher" class="btn secondary" type="button">Refresh Gallery</button></div><div id="teacherMsg" class="teacher-note"></div></section><div class="layout">'
          if 'id="teacherBtn"' not in s:
              if old not in s: raise SystemExit('toolbar marker not found')
              s=s.replace(old,new,1)
          modal='<div id="teacherUnlock" class="modal"><div class="unlockbox"><h3>Unlock Teacher Controls</h3><p class="small">Enter the teacher passcode.</p><input id="teacherPass" type="password" autocomplete="off" placeholder="Passcode"><div class="actions"><button id="unlockTeacher" class="btn" type="button">Unlock</button><button id="cancelTeacher" class="btn secondary" type="button">Cancel</button></div><p id="unlockMsg" class="small"></p></div></div>'
          if 'id="teacherUnlock"' not in s:
              s=s.replace('<div id="commentModal" class="modal">',modal+'<div id="commentModal" class="modal">',1)
          js="""
let teacherKey='';
function fillTeacherPanel(){if(!state||!state.project)return;const p=state.project;$('tStatus').value=p.status||'submissions';$('tMaxVotes').value=p.maxVotes||1;$('tBlock').value=p.block||'All';$('tComments').checked=!!p.commentsEnabled;$('tAnonymous').checked=!!p.anonymousVoting;$('tLate').checked=!!p.allowLate;$('tLateEligible').checked=!!p.lateEligible;$('tResults').checked=!!p.revealResults;}
$('teacherBtn').onclick=()=>{if(sessionStorage.getItem('mrdhqGalleryTeacher')==='1'&&sessionStorage.getItem('mrdhqGalleryTeacherKey')){teacherKey=sessionStorage.getItem('mrdhqGalleryTeacherKey');$('teacherPanel').classList.add('show');fillTeacherPanel();return;}$('teacherPass').value='';$('unlockMsg').textContent='';$('teacherUnlock').classList.add('show');setTimeout(()=>$('teacherPass').focus(),50);};
$('cancelTeacher').onclick=()=> $('teacherUnlock').classList.remove('show');
$('unlockTeacher').onclick=async()=>{const pass=$('teacherPass').value.trim();if(pass.toLowerCase()!=='maverick'){$('unlockMsg').textContent='Passcode not recognized.';return;}try{const d=await call({action:'adminState',teacherKey:pass});if(!d.success)throw new Error(d.error||'Teacher key not accepted by the backend.');teacherKey=pass;sessionStorage.setItem('mrdhqGalleryTeacher','1');sessionStorage.setItem('mrdhqGalleryTeacherKey',pass);$('teacherUnlock').classList.remove('show');$('teacherPanel').classList.add('show');fillTeacherPanel();$('teacherMsg').textContent='Teacher controls unlocked.';}catch(e){$('unlockMsg').textContent=e.message;}};
$('teacherPass').addEventListener('keydown',e=>{if(e.key==='Enter')$('unlockTeacher').click();});
$('lockTeacher').onclick=()=>{teacherKey='';sessionStorage.removeItem('mrdhqGalleryTeacher');sessionStorage.removeItem('mrdhqGalleryTeacherKey');$('teacherPanel').classList.remove('show');};
$('refreshTeacher').onclick=()=>load(state&&state.project?state.project.id:'');
$('saveTeacher').onclick=async()=>{try{if(!teacherKey)throw new Error('Unlock teacher controls first.');const p=state.project;$('teacherMsg').textContent='Saving...';const d=await call({action:'saveProject',teacherKey,projectId:p.id,title:p.title,directions:p.directions,block:$('tBlock').value.trim()||'All',status:$('tStatus').value,maxVotes:$('tMaxVotes').value,commentsEnabled:$('tComments').checked,anonymousVoting:$('tAnonymous').checked,allowLate:$('tLate').checked,lateEligible:$('tLateEligible').checked,revealResults:$('tResults').checked,submissionDeadline:p.submissionDeadline||'',votingDeadline:p.votingDeadline||''});if(!d.success)throw new Error(d.error||'Unable to save settings.');$('teacherMsg').textContent='Saved. Gallery updated.';await load(p.id);fillTeacherPanel();}catch(e){$('teacherMsg').textContent=e.message;}};
"""
          endmarker="$('projectSelect').onchange=e=>load(e.target.value);"
          if 'function fillTeacherPanel()' not in s:
              if endmarker not in s: raise SystemExit('script marker not found')
              s=s.replace(endmarker,js+endmarker,1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add marketing/project-gallery/index.html
          git commit -m "Add inline teacher controls to Marketing Project Gallery" || exit 0
          git push
