name: Patch Canvas teacher progress

on:
  push:
    paths:
      - '.github/workflows/patch-canvas-teacher-progress.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add teacher progress script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ap-business/business-canvas/index.html')
          s = p.read_text(encoding='utf-8')
          old = '<script src="app.js"></script>'
          new = '<script src="app.js"></script>\n<script src="teacher-progress.js"></script>'
          if 'teacher-progress.js' not in s:
              if old not in s:
                  raise SystemExit('app.js script tag not found')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ap-business/business-canvas/index.html
          git commit -m 'Wire Canvas teacher progress dashboard [skip ci]'
          git push
