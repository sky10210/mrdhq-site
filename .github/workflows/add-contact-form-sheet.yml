name: Add contact form sheet routing

on:
  push:
    paths:
      - '.github/workflows/add-contact-form-sheet.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-contact-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch homepage and Apps Script source
        run: |
          python - <<'PY'
          from pathlib import Path

          backend = Path('opening-bell/google-apps-script.gs')
          text = backend.read_text()
          route = "    if (action === 'moduleSubmit') return handleModuleSubmit_(ss, p);"
          if "action === 'contactSubmit'" not in text:
              text = text.replace(route, route + "\n    if (action === 'contactSubmit') return handleContactSubmit_(ss, p);")

          marker = "function handleDiscussion_(ss,p,action){"
          if "function handleContactSubmit_" not in text:
              fn = r'''function handleContactSubmit_(ss,p){
  var name=clean_(p.name||''),email=clean_(p.email||''),message=clean_(p.message||p.answer||p.response||'');
  if(!name||!email||!message) return json_({success:false,error:'Name, email, and message are required.'});
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return json_({success:false,error:'Enter a valid email address.'});
  if(message.length>5000) message=message.substring(0,5000);
  var sh=ss.getSheetByName('Contact Form');
  var headers=['Timestamp','Date','Name','Email','Message','Source'];
  if(!sh){sh=ss.insertSheet('Contact Form');sh.appendRow(headers);sh.setFrozenRows(1)}
  else sh.getRange(1,1,1,headers.length).setValues([headers]);
  var now=parseTimestamp_(p.timestamp);
  sh.appendRow([now,formatDate_(now),name,email,message,'MRDHQ Homepage']);
  return json_({success:true,tab:'Contact Form'});
}

'''
              text = text.replace(marker, fn + marker)
          backend.write_text(text)

          home = Path('index.html')
          html = home.read_text()
          old = "const p=new URLSearchParams({timestamp:new Date().toISOString(),cls:'Website Contact',"
          new = "const p=new URLSearchParams({action:'contactSubmit',timestamp:new Date().toISOString(),name:name,email:email,message:message,cls:'Website Contact',"
          if old in html:
              html = html.replace(old,new)
          else:
              # If the compact script changed, inject action into the current params object.
              html = html.replace("const p=new URLSearchParams({timestamp:new Date().toISOString()", "const p=new URLSearchParams({action:'contactSubmit',timestamp:new Date().toISOString()")
          home.write_text(html)
          PY
      - name: Commit routing changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html opening-bell/google-apps-script.gs
          git diff --cached --quiet && exit 0
          git commit -m "Route homepage contact form to Contact Form sheet"
          git push
