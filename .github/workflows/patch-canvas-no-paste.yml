name: Patch Canvas no paste

on:
  push:
    paths:
      - '.github/workflows/patch-canvas-no-paste.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire no-paste guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ap-business/business-canvas/index.html')
          s = p.read_text()
          tag = '<script src="no-paste.js"></script>'
          if tag not in s:
              s = s.replace('</body>', tag + '\n</body>')
              p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ap-business/business-canvas/index.html
          git commit -m "Disable paste in Canvas Studio [skip ci]" || exit 0
          git push
