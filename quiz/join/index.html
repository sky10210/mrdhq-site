<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join a Quiz | MRDHQ</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at top right,#d9e9f8,transparent 55%),#f6f1e8;font:500 16px Poppins,sans-serif;color:#192941;display:grid;place-items:center;padding:20px}.panel{width:min(440px,100%);background:#fffefa;padding:35px;border:1px solid #dce1e7;border-radius:25px;box-shadow:0 14px 44px #16243a15}a{color:#376fb7;text-decoration:none}h1{font-size:clamp(30px,8vw,45px);line-height:1.1;letter-spacing:-1.7px;margin:18px 0 10px}p{color:#657185;line-height:1.5}.code{width:100%;font:800 31px Poppins;text-align:center;text-transform:uppercase;letter-spacing:4px;padding:15px;border:2px solid #d5dce6;border-radius:15px;margin:12px 0 8px}.code:focus{outline:3px solid #b6d3f7}button{width:100%;border:0;background:#192941;color:white;font:700 16px Poppins;padding:15px;border-radius:13px;cursor:pointer}button:hover{background:#3266a7}.error{color:#a43232;font-size:13px;min-height:22px}.fine{font-size:12px;margin-top:22px}.brand{font-size:16px;font-weight:800;letter-spacing:-.6px}</style></head><body><main class="panel"><a href="../" class="brand">MRDHQ / QUIZ</a><h1>Ready to play?</h1><p>Enter the activity code from your host, or scan the QR code on their screen.</p><form id="join"><label for="code"><b>Activity code</b></label><input class="code" id="code" maxlength="12" autocomplete="off" inputmode="text" placeholder="VENUES" aria-describedby="error" required><div class="error" id="error" role="status" aria-live="polite"></div><button type="submit">Join quiz →</button></form><p class="fine">Try <b>VENUES</b> for the Iconic Venues challenge. Activity codes open self-paced quizzes. Synchronized live room PINs are not available yet.</p><p><a href="../">← Browse Quiz Studio</a></p></main><script>const form=document.getElementById('join'),code=document.getElementById('code'),error=document.getElementById('error');form.addEventListener('submit',e=>{e.preventDefault();const c=code.value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(c==='VENUES'){location.href='../?mode=challenge'}else error.textContent='No activity found for that code. Check with your host.'});const p=new URLSearchParams(location.search);if(p.has('code'))code.value=p.get('code').slice(0,12);</script></body></html>
